<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novedades Profertil</title>
<meta name="description" content="Maqueta del archivo de notas de profertil.com.ar sobre el concepto web del manual de marca: las 471 notas reales del sitio actual, con buscador y filtros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Novedades Profertil: maqueta del archivo de notas.
   Layout: banda azul del concepto web (manual p. 110) con el histograma de
   publicaciones por año, buscador fijo en vidrio, grilla masonry de tarjetas
   y panel de filtros flotante (tipo de nota, pilar, cultivo).
   Paleta, pares de color, formas e iconos son los oficiales del manual de
   marca y de las herramientas del sistema. Un solo tema, a proposito: el
   manual define la web sobre tiza y no tiene version oscura.
   ========================================================================== */
:root {
  color-scheme: light;
  /* Paleta del manual (p. 46) */
  --azul: #003DA5;
  --celeste: #4086FF;
  --verde: #2D8035;
  --verde-claro: #5EB53A;
  --amarillo: #EABA2C;
  --naranja: #E57F19;
  --terra: #8A4818;
  --tiza: #FFFEEF;

  --bg: #F2F0DC;
  --card: #FFFFFF;
  --ink: #0A1E4A;
  --ink-2: #44506E;
  --ink-3: #737D96;
  --line: rgba(10, 30, 74, 0.1);
  --glass: rgba(255, 254, 239, 0.78);
  --shadow: 0 1px 2px rgba(10, 30, 74, 0.06), 0 12px 28px -16px rgba(10, 30, 74, 0.28);

  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
.wrap { width: min(100% - 32px, 1320px); margin-inline: auto; }
.ico { display: block; width: 100%; height: 100%; }

/* --- Banda azul (concepto web) -------------------------------------------- */
.band {
  position: relative;
  overflow: hidden;
  background: var(--azul);
  color: var(--tiza);
  padding-block: 18px 0;
}
.band-art { position: absolute; inset: 0 0 auto auto; width: min(44vw, 560px); height: 100%; pointer-events: none; }
.band-art svg { position: absolute; right: 0; bottom: 0; height: 100%; width: auto; }
.nav { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; flex: none; }
.logo svg { width: 30px; height: 30px; }
.logo span { font-family: var(--f-display); font-weight: 500; font-size: 0.82rem; letter-spacing: 0.02em; line-height: 1; }
.menu {
  display: flex; gap: 2px; padding: 5px;
  border-radius: 999px;
  background: rgba(255, 254, 239, 0.14);
  border: 1px solid rgba(255, 254, 239, 0.2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.menu span { padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; white-space: nowrap; color: rgba(255, 254, 239, 0.88); }
.menu span[aria-current] { background: var(--tiza); color: var(--azul); font-weight: 500; }
.menu-mobile { display: none; align-items: center; gap: 8px; padding: 8px 14px; }
.menu-mobile i { display: grid; grid-template-columns: repeat(2, 7px); gap: 3px; }
.menu-mobile i b { width: 7px; height: 7px; border-radius: 999px; border: 1.5px solid currentColor; }
.round {
  width: 42px; height: 42px; flex: none;
  border-radius: 999px; border: 1px solid rgba(255, 254, 239, 0.2);
  background: rgba(255, 254, 239, 0.14);
  display: grid; place-items: center; cursor: pointer; color: var(--tiza);
}
.round svg { width: 20px; height: 20px; }

.hero { position: relative; z-index: 1; display: grid; gap: 18px; padding-block: clamp(36px, 7vw, 76px) 28px; max-width: 760px; }
.kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.86rem; color: rgba(255, 254, 239, 0.8); }
.sample { padding: 4px 10px; border-radius: 999px; border: 1px dashed rgba(255, 254, 239, 0.5); font-size: 0.76rem; }
h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(3.2rem, 11vw, 7.6rem);
  line-height: 0.88;
  letter-spacing: -0.045em;
}
.lede { margin: 0; max-width: 52ch; font-size: clamp(1rem, 1.6vw, 1.14rem); line-height: 1.5; color: rgba(255, 254, 239, 0.9); }
.lede b { font-weight: 600; color: var(--tiza); }

/* Histograma: notas por año. Cada barra filtra por ese año. */
.hist { position: relative; z-index: 1; padding-block: 8px 26px; max-width: 760px; }
.hist-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 24px; font-size: 0.82rem; color: rgba(255, 254, 239, 0.78); }
.hist-head b { color: var(--tiza); font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; align-items: end; height: 92px; }
.bar {
  position: relative;
  height: 100%;
  border: 0; padding: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch;
}
.bar i {
  display: block; height: var(--h); min-height: 3px;
  border-radius: 6px 6px 2px 2px;
  background: rgba(255, 254, 239, 0.32);
  transition: background 180ms ease, transform 300ms var(--ease);
  transform-origin: bottom;
}
.bar:hover i { background: rgba(255, 254, 239, 0.6); }
.bar[aria-pressed="true"] i { background: var(--amarillo); }
.bar span {
  position: absolute; bottom: calc(var(--h) + 4px); left: 50%; transform: translateX(-50%);
  font-size: 0.66rem; font-variant-numeric: tabular-nums; color: rgba(255, 254, 239, 0.75);
}
.years { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.years span { text-align: center; font-size: 0.66rem; font-variant-numeric: tabular-nums; color: rgba(255, 254, 239, 0.7); }

/* --- Buscador ------------------------------------------------------------- */
.search-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; padding-block: 12px; }
.search {
  width: min(100%, 760px);
  margin-inline: auto;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px 7px 7px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
}
.search-mark { width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--azul); display: grid; place-items: center; }
.search-mark svg { width: 24px; height: 24px; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font-family: var(--f-display); font-size: 1.14rem; color: var(--ink); padding: 8px 2px;
}
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.q-clear { width: 34px; height: 34px; flex: none; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.q-clear:hover { background: var(--line); color: var(--ink); }
.q-clear svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.q-count { flex: none; padding: 8px 12px; border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: 0.86rem; font-variant-numeric: tabular-nums; }

/* --- Resultado ------------------------------------------------------------ */
.result-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-block: 6px 16px; }
.result-text { margin: 0; color: var(--ink-2); min-width: 0; }
.result-text b { color: var(--azul); font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--line); }
.seg button { border: 0; background: transparent; cursor: pointer; padding: 6px 13px; border-radius: 999px; font-size: 0.86rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--azul); font-weight: 500; box-shadow: 0 1px 3px rgba(10, 30, 74, 0.12); }

/* --- Grilla --------------------------------------------------------------- */
.grid { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 170px; }
.gcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.sentinel { height: 1px; }

.card {
  position: relative; display: grid; text-align: left;
  border: 0; padding: 0; cursor: pointer;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--shadow);
  transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
  animation: entra 420ms var(--ease) both;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(10, 30, 74, 0.06), 0 18px 34px -16px rgba(10, 30, 74, 0.34); }
@keyframes entra { from { transform: translateY(8px); } to { transform: none; } }
@supports (corner-shape: squircle) { .card, .media, .m-art { corner-shape: squircle; } }

.media { position: relative; margin: 8px 8px 0; border-radius: 19px; overflow: hidden; line-height: 0; max-width: 100%; }
.media > svg { display: block; width: 100%; height: auto; }
.media .etq { position: absolute; top: 10px; left: 10px; }
.play { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 999px; background: rgba(255, 254, 239, 0.94); display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; fill: var(--azul); margin-left: 2px; }

.lead { padding: 18px 18px 2px; display: grid; gap: 14px; justify-items: start; }
.lead h3 {
  margin: 0;
  font-family: var(--f-display); font-weight: 600;
  font-size: 1.36rem; line-height: 1.06; letter-spacing: -0.025em;
  color: var(--azul);
  text-wrap: balance;
}
.meta { padding: 12px 18px 18px; display: grid; gap: 8px; min-width: 0; }
.when { margin: 0; font-size: 0.84rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when b { font-weight: 500; color: var(--ink-2); }
.ttl {
  margin: 0;
  font-family: var(--f-display); font-weight: 500;
  font-size: 1.1rem; line-height: 1.2; letter-spacing: -0.015em;
  color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
mark { background: rgba(234, 186, 44, 0.42); color: inherit; border-radius: 3px; padding: 0 1px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.more { font-size: 0.86rem; color: var(--ink-3); padding-left: 2px; }

/* --- Etiqueta (manual p. 64): cuadro de color con icono + rotulo ----------
   Radio = 32% del alto, que es la regla de esquinas del sistema (p. 66). */
.etq { --c: var(--azul); --s: 26px; display: inline-flex; align-items: stretch; gap: 2px; height: var(--s); flex: none; }
.etq i {
  width: var(--s); height: var(--s); flex: none;
  border-radius: calc(var(--s) * 0.32);
  background: var(--c); color: #fff;
  display: grid; place-items: center;
}
.etq i svg { width: 64%; height: 64%; }
.etq span {
  display: inline-flex; align-items: center;
  padding: 0 calc(var(--s) * 0.38);
  border-radius: calc(var(--s) * 0.32);
  background: var(--tiza);
  color: var(--ink);
  font-size: calc(var(--s) * 0.48);
  font-weight: 500;
  white-space: nowrap;
  box-shadow: inset 0 0 0 1px rgba(10, 30, 74, 0.08);
}
.media .etq span { box-shadow: none; }
.etq-sm { --s: 24px; }
button.etq { border: 0; padding: 0; background: transparent; cursor: pointer; }
button.etq span { transition: background 160ms ease, color 160ms ease; }
button.etq:hover span { background: #fff; }
button.etq[aria-pressed="true"] span { background: var(--c); color: var(--on, #fff); box-shadow: none; }
.etq .n { margin-left: 6px; font-weight: 400; font-size: 0.86em; opacity: 0.6; font-variant-numeric: tabular-nums; }

/* --- Panel de filtros ----------------------------------------------------- */
.filters {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: min(100% - 24px, 780px);
  max-height: calc(100% - 110px);
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  border-radius: 30px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.92);
  box-shadow: 0 24px 60px -24px rgba(10, 30, 74, 0.5);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  overflow: hidden;
}
.f-body { overflow-y: auto; padding: 20px 22px 8px; display: grid; gap: 16px; }
.filters:not(.open) .f-body { display: none; }
.f-group { display: grid; gap: 9px; }
.f-label { margin: 0; font-size: 0.76rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.f-row { display: flex; flex-wrap: wrap; gap: 8px; }
.f-foot { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); }
.filters:not(.open) .f-foot { border-top: 0; }
.f-toggle { display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 999px; font-family: var(--f-display); font-size: 1.12rem; color: var(--azul); }
.f-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 300ms var(--ease); }
.filters.open .f-toggle svg { transform: rotate(180deg); }
.f-count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px; background: var(--verde); color: #fff; display: inline-grid; place-items: center; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
.f-clear { border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 999px; color: var(--azul); font-size: 0.9rem; }
.f-clear:hover { background: var(--line); }

/* --- Vacio ---------------------------------------------------------------- */
.empty { padding: 60px 0 200px; display: grid; justify-items: center; gap: 14px; text-align: center; }
.empty svg { width: 76px; height: 76px; }
.empty p { margin: 0; max-width: 42ch; color: var(--ink-2); font-size: 1.05rem; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 18px;
  border: 0; border-radius: 13px; cursor: pointer; text-decoration: none;
  background: var(--verde); color: #fff; font-weight: 500; font-size: 0.95rem;
}
.btn:hover { background: #256c2c; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Detalle ---------------------------------------------------------------- */
dialog.modal {
  width: min(100% - 24px, 760px); max-height: calc(100% - 32px);
  padding: 0; border: 0; border-radius: 28px;
  background: var(--card); color: var(--ink);
  box-shadow: 0 30px 80px -20px rgba(10, 30, 74, 0.55);
  overflow: hidden;
}
dialog.modal[open] { display: grid; grid-template-rows: minmax(0, 1fr) auto; animation: sube 360ms var(--ease); }
@keyframes sube { from { transform: translateY(16px); opacity: 0.4; } to { transform: none; opacity: 1; } }
dialog.modal::backdrop { background: rgba(0, 30, 82, 0.55); backdrop-filter: blur(4px); }
.m-scroll { overflow-y: auto; padding: 10px; }
.m-art { position: relative; border-radius: 20px; overflow: hidden; line-height: 0; }
.m-art > svg { width: 100%; height: auto; display: block; }
.m-art .etq { position: absolute; top: 14px; left: 14px; --s: 30px; }
.m-body { padding: 20px 16px 12px; display: grid; gap: 14px; }
.m-date { margin: 0; color: var(--ink-3); font-size: 0.92rem; }
.m-body h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: clamp(1.7rem, 4.4vw, 2.5rem); line-height: 1.02; letter-spacing: -0.035em; color: var(--azul); text-wrap: balance; }
.m-bajada { margin: 0; max-width: 62ch; font-size: 1.06rem; line-height: 1.55; }
.m-aviso { margin: 0; max-width: 62ch; padding: 12px 14px; border-radius: 14px; background: rgba(234, 186, 44, 0.16); color: var(--ink-2); font-size: 0.92rem; line-height: 1.5; }
.m-aviso b { color: var(--ink); font-weight: 600; }
.m-data { margin: 2px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border-radius: 16px; overflow: hidden; }
.m-data div { background: var(--card); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.m-data dt { font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.m-data dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.m-data .ruta { grid-column: 1 / -1; }
.m-data .ruta dd { font-family: var(--f-mono); font-size: 0.8rem; font-weight: 400; color: var(--ink-2); }
.m-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.m-nav .pos { font-size: 0.86rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.m-nav-group { display: flex; gap: 6px; }
.icon-btn { width: 42px; height: 42px; border-radius: 13px; border: 0; background: var(--line); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(10, 30, 74, 0.16); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 860px) {
  .menu span:not([aria-current]) { display: none; }
}
@media (max-width: 640px) {
  .menu { display: none; }
  .menu-mobile { display: inline-flex; border-radius: 999px; background: rgba(255, 254, 239, 0.14); border: 1px solid rgba(255, 254, 239, 0.2); font-size: 0.82rem; }
  .band-art { display: none; }
  .hist-hint { display: none; }
  .years span:nth-child(even) { visibility: hidden; }
  .bar span { display: none; }
  .grid, .gcol { gap: 10px; }
  .card { border-radius: 20px; }
  .media { margin: 6px 6px 0; border-radius: 15px; }
  .media .etq { top: 7px; left: 7px; --s: 22px; }
  .play { width: 28px; height: 28px; top: 7px; right: 7px; }
  .lead { padding: 13px 12px 2px; gap: 10px; }
  .lead h3 { font-size: 1.08rem; }
  .lead .etq { --s: 22px; }
  .meta { padding: 9px 12px 13px; gap: 6px; }
  .when { font-size: 0.76rem; }
  .ttl { font-size: 0.96rem; }
  .etq-sm { --s: 21px; }
  .search-mark { width: 38px; height: 38px; }
  .search input { font-size: 1rem; }
  .f-body { padding: 18px 16px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs">
  <!-- Isotipo Profertil -->
  <symbol id="isotipo" viewBox="0 0 292 292"><path d="M30.2695 152.09C132.309 158.14 156.099 222.86 161.089 261.95C166.089 222.85 189.889 158.159 291.909 152.109C292.859 181.969 290.929 287.27 161.839 291.47C161.319 291.47 160.849 291.47 160.329 291.45C31.2493 287.24 29.3295 181.94 30.2695 152.09ZM171.531 10.6104C218.391 57.4704 218.391 133.45 171.531 180.32L160.911 190.93L150.301 180.32C103.441 133.46 103.441 57.4804 150.301 10.6104L160.911 0L171.531 10.6104Z"/></symbol>
</defs></svg>

<header class="band">
  <div class="band-art" id="bandArt" aria-hidden="true"></div>
  <div class="wrap">
    <nav class="nav" aria-label="Sitio">
      <a class="logo" href="https://www.profertil.com.ar/" aria-label="Profertil">
        <svg viewBox="0 0 292 292" fill="var(--tiza)" aria-hidden="true"><use href="#isotipo"/></svg>
        <span>PROFERTIL</span>
      </a>
      <div class="menu" aria-hidden="true">
        <span>Home</span><span>Empresa</span><span>Sostenibilidad</span><span>Productos y Servicios</span><span aria-current="page">Novedades</span><span>Compliance</span>
      </div>
      <span class="menu-mobile" aria-hidden="true"><i><b></b><b></b><b></b><b></b></i>Menú</span>
      <button class="round" id="goSearch" type="button" aria-label="Buscar notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>

  function etq(id, extra, cls) {
    var x = POR[id];
    return '<span class="etq ' + (cls || "") + '" style="--c:' + x.c + '"><i>' + ico(id) + "</i><span>" + x.nombre + (extra || "") + "</span></span>";
  }

  /* --- Estado ------------------------------------------------------------- */
  var estado = { q: "", tipos: {}, pilares: {}, cultivos: {}, anios: {}, orden: "new" };
  var lista = [];
  var pintadas = 0;
  var TANDA = 30;
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid");
  function activos(o) { return Object.keys(o).filter(function (k) { return o[k]; }); }

  function pasa(n, salvo) {
    var q = plano(estado.q.trim());
    if (q && n.buscable.indexOf(q) === -1) return false;
    var ts = activos(estado.tipos), ps = activos(estado.pilares), cs = activos(estado.cultivos), as = activos(estado.anios);
    if (salvo !== "tipo" && ts.length && ts.indexOf(n.tp) === -1) return false;
    if (salvo !== "pilar" && ps.length && !n.p.some(function (x) { return ps.indexOf(x) !== -1; })) return false;
    if (salvo !== "cultivo" && cs.length && !n.c.some(function (x) { return cs.indexOf(x) !== -1; })) return false;
    if (salvo !== "anio" && as.length && as.indexOf(n.anio) === -1) return false;
    return true;
  }
  function filtrar() {
    lista = NOTAS.filter(function (n) { return pasa(n); });
    if (estado.orden === "new") lista.reverse();
  }

  /* --- Masonry ------------------------------------------------------------ */
  var cols = [];
  function cuantasCols() { var w = grid.clientWidth; return w < 700 ? 2 : w < 1020 ? 3 : w < 1260 ? 4 : 5; }
  function armarCols() {
    grid.innerHTML = ""; cols = [];
    for (var i = 0, n = cuantasCols(); i < n; i++) { var c = document.createElement("div"); c.className = "gcol"; grid.appendChild(c); cols.push(c); }
  }
  function conArte(n) { return n.v || ((n.id * 2654435761) >>> 0) % 100 < 46; }

  function tarjeta(n, idx) {
    var q = plano(estado.q.trim());
    var b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.dataset.idx = idx;
    var temas = n.p.concat(n.c);
    var tags = temas.slice(0, 2).map(function (x) { return etq(x, "", "etq-sm"); }).join("");
    if (temas.length > 2) tags += '<span class="more">+' + (temas.length - 2) + "</span>";
    var when = '<p class="when"><b>' + fecha(n.f) + "</b>" + (n.s ? " · " + SUB[n.s] : "") + "</p>";
    var h;
    if (conArte(n)) {
      var pr = PROP[n.id % PROP.length];
      h = '<div class="media">' + arte(n, pr[0] * 60, pr[1] * 60, n.id * 7919 + 13) + etq(n.tp) +
        (n.v ? '<span class="play"><svg viewBox="0 0 12 14"><path d="M0 0l12 7-12 7Z"/></svg></span>' : "") + "</div>" +
        '<div class="meta">' + when + '<p class="ttl">' + resaltar(n.t, q) + '</p><div class="tags">' + tags + "</div></div>";
    } else {
      h = '<div class="lead">' + etq(n.tp) + "<h3>" + resaltar(n.t, q) + '</h3></div><div class="meta">' + when + '<div class="tags">' + tags + "</div></div>";
    }
    b.innerHTML = h;
    b.setAttribute("aria-label", n.t + ". " + POR[n.tp].nombre + ", " + fecha(n.f, true));
    return b;
  }
  function pintarTanda() {
    var hasta = Math.min(pintadas + TANDA, lista.length);
    for (var i = pintadas; i < hasta; i++) {
      var corta = cols[0];
      for (var c = 1; c < cols.length; c++) if (cols[c].offsetHeight < corta.offsetHeight) corta = cols[c];
      corta.appendChild(tarjeta(lista[i], i));
    }
    pintadas = hasta;
  }
  function repintar(mantener) {
    var objetivo = mantener ? Math.max(pintadas, TANDA) : TANDA;
    armarCols(); pintadas = 0;
    while (pintadas < Math.min(objetivo, lista.length)) pintarTanda();
    $("empty").hidden = lista.length > 0;
  }

  /* --- Histograma por año -------------------------------------------------- */
  var ANIOS = [];
  NOTAS.forEach(function (n) { if (n.anio && ANIOS.indexOf(n.anio) === -1) ANIOS.push(n.anio); });
  ANIOS.sort();
  $("bars").style.setProperty("--n", ANIOS.length);
  $("years").style.setProperty("--n", ANIOS.length);
  $("years").innerHTML = ANIOS.map(function (a) { return "<span>" + (ANIOS.length > 10 ? "’" + a.slice(2) : a) + "</span>"; }).join("");
  var porAnioTotal = {};
  NOTAS.forEach(function (n) { porAnioTotal[n.anio] = (porAnioTotal[n.anio] || 0) + 1; });
  var maxAnio = Math.max.apply(null, ANIOS.map(function (a) { return porAnioTotal[a]; }));
  function pintarBarras() {
    // La altura es siempre el total del año; el numero muestra cuantas quedan con los filtros.
    $("bars").innerHTML = ANIOS.map(function (a) {
      var vis = NOTAS.reduce(function (s, n) { return s + (n.anio === a && pasa(n, "anio") ? 1 : 0); }, 0);
      var h = Math.round(vis / maxAnio * 100);
      return '<button type="button" class="bar" style="--h:' + h + '%" data-anio="' + a + '" aria-pressed="' + !!estado.anios[a] + '" aria-label="' + a + ": " + vis + ' notas"><span>' + vis + "</span><i></i></button>";
    }).join("");
  }
  var pico = ANIOS.slice().sort(function (a, b) { return porAnioTotal[b] - porAnioTotal[a]; })[0];
  var sinBajada = NOTAS.filter(function (n) { return !n.b; }).length;
  $("lede").innerHTML = "Las <b>" + NOTAS.length + " notas</b> que hoy publica el sitio, de " + ANIOS[0] + " a " + ANIOS[ANIOS.length - 1] + ", en un solo lugar. Buscá por palabra o filtrá por tipo de nota, pilar de marca, cultivo y año.";
  $("histInfo").innerHTML = "Pico en <b>" + pico + "</b> · " + porAnioTotal[pico] + " notas";

  /* --- Filtros ------------------------------------------------------------ */
  function contar(campo, v) {
    return NOTAS.reduce(function (s, n) {
      if (!pasa(n, campo)) return s;
      var ok = campo === "tipo" ? n.tp === v : campo === "pilar" ? n.p.indexOf(v) !== -1 : n.c.indexOf(v) !== -1;
      return s + (ok ? 1 : 0);
    }, 0);
  }
  function chip(x, campo, mapa) {
    return '<button type="button" class="etq" data-f="' + campo + '" data-v="' + x.id + '" style="--c:' + x.c + ";--on:" + (x.on || "#fff") + '" aria-pressed="' + !!mapa[x.id] + '"><i>' + ico(x.id) + "</i><span>" + x.nombre + '<b class="n">' + contar(campo, x.id) + "</b></span></button>";
  }
  function pintarFiltros() {
    $("fTipos").innerHTML = TIPOS.map(function (x) { return chip(x, "tipo", estado.tipos); }).join("");
    $("fPilares").innerHTML = PILARES.map(function (x) { return chip(x, "pilar", estado.pilares); }).join("");
    $("fCultivos").innerHTML = CULTIVOS.map(function (x) { return chip(x, "cultivo", estado.cultivos); }).join("");
  }
  function resumen() {
    var partes = [];
    [[estado.tipos, TIPOS], [estado.pilares, PILARES], [estado.cultivos, CULTIVOS]].forEach(function (g) {
      var a = activos(g[0]).map(function (k) { return POR[k].nombre; });
      if (a.length) partes.push(a.join(", "));
    });
    var as = activos(estado.anios).sort();
    if (as.length) partes.push(as.join(", "));
    var q = estado.q.trim();
    var t = "<b>" + lista.length + "</b> " + (lista.length === 1 ? "nota" : "notas");
    if (q) t += " con «" + esc(q) + "»";
    if (partes.length) t += " · " + esc(partes.join(" · "));
    if (!q && !partes.length) t = "Todas las notas · <b>" + lista.length + "</b>";
    $("resultText").innerHTML = t;
    $("qCount").textContent = lista.length;
    var nf = activos(estado.tipos).length + activos(estado.pilares).length + activos(estado.cultivos).length + as.length;
    $("fCount").hidden = nf === 0; $("fCount").textContent = nf;
    $("fClear").hidden = nf === 0 && !q;
    $("qClear").hidden = !q;
    $("emptyText").textContent = q
      ? "Ninguna nota coincide con «" + q + "»" + (nf ? " con esos filtros" : "") + ". Probá con otra palabra o limpiá los filtros."
      : "Ninguna nota cumple esa combinación de filtros. Sacá alguno para ver más.";
  }
  function aplicar() { filtrar(); resumen(); pintarFiltros(); pintarBarras(); repintar(false); }

  /* --- Eventos -------------------------------------------------------------- */
  var tq;
  $("q").addEventListener("input", function (e) { clearTimeout(tq); tq = setTimeout(function () { estado.q = e.target.value; aplicar(); }, 120); });
  $("qClear").addEventListener("click", function () { $("q").value = ""; estado.q = ""; aplicar(); $("q").focus(); });
  $("goSearch").addEventListener("click", function () { $("q").focus(); $("q").scrollIntoView({ block: "center", behavior: "smooth" }); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== $("q") && !$("modal").open) { e.preventDefault(); $("q").focus(); }
  });
  $("filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]"); if (!b) return;
    var m = { tipo: estado.tipos, pilar: estado.pilares, cultivo: estado.cultivos }[b.dataset.f];
    m[b.dataset.v] = !m[b.dataset.v]; aplicar();
  });
  $("bars").addEventListener("click", function (e) {
    var b = e.target.closest("[data-anio]"); if (!b) return;
    estado.anios[b.dataset.anio] = !estado.anios[b.dataset.anio]; aplicar();
  });
  function limpiar() { estado.tipos = {}; estado.pilares = {}; estado.cultivos = {}; estado.anios = {}; estado.q = ""; $("q").value = ""; aplicar(); }
  $("fClear").addEventListener("click", limpiar);
  $("emptyReset").addEventListener("click", limpiar);
  function abrirFiltros(si) { $("filters").classList.toggle("open", si); $("fToggle").setAttribute("aria-expanded", String(si)); }
  $("fToggle").addEventListener("click", function () { abrirFiltros(!$("filters").classList.contains("open")); });
  abrirFiltros(false);
  if (window.innerWidth < 640) $("q").placeholder = "Buscá: trigo, becas…";
  function ordenar(o) { estado.orden = o; $("sortNew").setAttribute("aria-pressed", String(o === "new")); $("sortOld").setAttribute("aria-pressed", String(o === "old")); aplicar(); }
  $("sortNew").addEventListener("click", function () { ordenar("new"); });
  $("sortOld").addEventListener("click", function () { ordenar("old"); });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && pintadas < lista.length) pintarTanda(); }, { rootMargin: "900px 0px" }).observe($("sentinel"));
  } else { TANDA = 1000; }
  var nCols = cuantasCols();
  window.addEventListener("resize", function () { var n = cuantasCols(); if (n !== nCols) { nCols = n; repintar(true); } });

  // Arte de la banda: la hoja oficial sobre un bloque verde, como en el concepto web.
  $("bandArt").innerHTML = '<svg viewBox="0 0 560 520" preserveAspectRatio="xMaxYMax slice"><rect x="300" y="250" width="260" height="270" fill="#2D8035"/>' +
    usar("hoja", 250, 120, 380, 380, 0, "#EABA2C") + "</svg>";

  /* --- Detalle ---------------------------------------------------------------- */
  var modal = $("modal");
  var actual = -1;
  function abrirNota(idx) {
    actual = idx;
    var n = lista[idx];
    var q = plano(estado.q.trim());
    var temas = n.p.concat(n.c);
    var h = '<div class="m-art">' + arte(n, 720, 300, n.id * 7919 + 13) + etq(n.tp) + "</div>";
    h += '<div class="m-body"><p class="m-date">' + fecha(n.f, true) + (n.s ? " · " + SUB[n.s] : "") + "</p>";
    h += '<h2 id="mTitle">' + resaltar(n.t, q) + "</h2>";
    h += n.b
      ? '<p class="m-bajada">' + resaltar(n.b, q) + "</p>"
      : '<p class="m-aviso"><b>Sin bajada propia.</b> La nota usa la descripción genérica del sitio, igual que ' + sinBajada + " de las " + NOTAS.length + " notas. En el sitio nuevo cada nota necesita la suya.</p>";
    h += '<div class="tags">' + temas.map(function (x) {
      var o = POR[x];
      return '<button type="button" class="etq" data-tema="' + x + '" style="--c:' + o.c + ";--on:" + (o.on || "#fff") + '" aria-pressed="false"><i>' + ico(x) + "</i><span>" + o.nombre + "</span></button>";
    }).join("") + "</div>";
    h += '<dl class="m-data">' +
      "<div><dt>Publicada</dt><dd>" + fecha(n.f) + "</dd></div>" +
      "<div><dt>Palabras</dt><dd>" + n.w.toLocaleString("es-AR") + "</dd></div>" +
      "<div><dt>Imágenes</dt><dd>" + n.i + (n.v ? " + video" : "") + "</dd></div>" +
      "<div><dt>Categoría en WordPress</dt><dd>" + (n.s ? SUB[n.s] : "Sin categoría") + "</dd></div>" +
      '<div class="ruta"><dt>Ruta actual</dt><dd>/index.php/' + esc(n.u) + "</dd></div></dl>";
    h += '<div><a class="btn" href="https://www.profertil.com.ar/index.php/' + esc(n.u) + '" target="_blank" rel="noopener">Ver la nota original <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div></div>';
    $("mScroll").innerHTML = h;
    $("mScroll").scrollTop = 0;
    $("mPos").textContent = (idx + 1) + " / " + lista.length;
    $("mPrev").disabled = idx === 0;
    $("mNext").disabled = idx === lista.length - 1;
    if (!modal.open) modal.showModal();
  }
  grid.addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) abrirNota(Number(c.dataset.idx)); });
  $("mPrev").addEventListener("click", function () { if (actual > 0) abrirNota(actual - 1); });
  $("mNext").addEventListener("click", function () { if (actual < lista.length - 1) abrirNota(actual + 1); });
  $("mClose").addEventListener("click", function () { modal.close(); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.close(); });
  modal.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && actual > 0) abrirNota(actual - 1);
    if (e.key === "ArrowRight" && actual < lista.length - 1) abrirNota(actual + 1);
  });
  $("mScroll").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tema]"); if (!b) return;
    var id = b.dataset.tema;
    estado.tipos = {}; estado.pilares = {}; estado.cultivos = {};
    (PILARES.some(function (p) { return p.id === id; }) ? estado.pilares : estado.cultivos)[id] = true;
    modal.close(); aplicar();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  aplicar();
})();
</script>
</body>
</html>
