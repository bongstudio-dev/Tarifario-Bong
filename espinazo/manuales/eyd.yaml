          - {titulo: "Qué resuelve el sistema", plantilla: T0_base, estado: muestra}
      - nombre: Construcción
        paginas:
          - {titulo: "Grilla y trazo", plantilla: T0_base, estado: muestra}
          - {titulo: "Cómo se dibuja un emblema nuevo", plantilla: T0_base, estado: pendiente}
          - {titulo: "Qué no hacer", plantilla: T0_base, estado: pendiente}
      - nombre: Biblioteca de emblemas
        paginas:
          - {titulo: "Emblemas por hierba", plantilla: T5_full_bleed, estado: muestra}
          - {titulo: "Emblemas por hierba", plantilla: T5_full_bleed, estado: muestra}
