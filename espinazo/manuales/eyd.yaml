  - num: 4
    nombre: Tipografía
    familia: A
    modulos:
      - nombre: Avería Serif
        paginas:
          - {titulo: "La tipográfica de titulares", plantilla: T5_full_bleed}
          - {titulo: "Pesos y usos", plantilla: T0_base}
      - nombre: Familia de cuerpo
        paginas:
          - {titulo: "La tipográfica de lectura", plantilla: T0_base}
      - nombre: Jerarquías
        paginas:
