<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,600,500,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;
       background:#004831;color:#fff;font-family:"Satoshi",sans-serif;
       padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:16px}
  .logo{color:#20c683}
  .kicker{font-family:"Space Mono",monospace;font-size:17px;letter-spacing:.14em;
          text-transform:uppercase;color:#7fa394}
  h1{font-size:82px;line-height:.95;letter-spacing:-.055em;font-weight:700;max-width:15ch}
  h1 em{font-style:normal;color:#20c683}
  .sub{margin-top:22px;font-size:25px;line-height:1.35;color:#95b5a9;max-width:30ch}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between}
  .chips{display:flex;gap:9px}
  .chip{font-family:"Space Mono",monospace;font-size:15px;padding:9px 16px;border-radius:999px;
        border:1px solid rgba(149,181,169,.3);color:#95b5a9}
  .url{font-family:"Space Mono",monospace;font-size:19px;color:#20c683}
</style>
</head>
<body>
  <div class="top">
    <svg class="logo" width="42" height="49" viewBox="0 0 82 96"><g fill="currentColor">
      <path d="M72.835 6.726C76.9 10.846 79.507 16.575 79.507 22.86s-2.607 11.995-6.672 16.134c-4.122 4.197-9.778 6.726-16.067 6.726-6.289 0-11.944-2.549-16.009-6.726-4.065-4.12-6.672-9.85-6.672-16.134 0-6.285 2.607-11.995 6.672-16.134C44.824 2.53 50.538 0 56.769 0c6.231 0 11.944 2.549 16.066 6.726Z"/>
      <path d="M27.34 6.994c1.016 2.664 1.016 5.845 0 8.566-.959 2.414-2.665 4.445-5.215 5.519 13.018 2.28 12.27 23.99-2.358 23.99H.02V.709h17.984c4.831 0 7.937 2.721 9.336 6.285Z"/>
      <path d="M0 50.51.038 95.598h16.738 14.57V51.085H16.776v18.798L.748 50.51H0Z"/>
      <path d="m57.843 73.178 11.829-20.465c-3.182-1.667-6.787-2.606-10.621-2.606-12.673 0-22.949 10.27-22.949 22.937 0 12.666 10.276 22.937 22.949 22.937 12.673 0 22.892-10.194 22.95-22.821H57.843Z"/>
    </g></svg>
    <span class="kicker">Bong Studio · Herramienta gratuita</span>
  </div>

  <div>
    <h1>¿Cuánto cobrar por <em>diseño</em>?</h1>
    <p class="sub">Calculá tu presupuesto de branding e identidad y comparalo contra el mercado.</p>
  </div>

  <div class="bottom">
    <div class="chips">
      <span class="chip">Branding</span>
      <span class="chip">Identidad</span>
      <span class="chip">Argentina + LATAM</span>
    </div>
    <span class="url">cotizador.bongstudio.ar</span>
  </div>
</body>
</html>
