<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sonidos · Cotizador Bong</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Tablero de sonidos del cotizador (usa sound.js, el mismo modulo de la app)
   y abajo un diagnostico: cada prueba va por un camino distinto y segun cual
   suene se sabe por que el cotizador no suena en un telefono puntual. No se
   linkea desde ningun lado. */
:root {
  color-scheme: dark;
  --bg: #004831;
  --card: #153226;
  --raise: rgba(32, 198, 131, 0.12);
  --text: #ffffff;
  --text-2: #95b5a9;
  --fill: #20c683;
  --on-fill: #003a27;
  --mono: "Space Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) 48px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}
main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.05em; line-height: 1; }
p { margin: 0; color: var(--text-2); line-height: 1.45; }
.mono { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fill); }
.card { padding: 16px; border-radius: 22px; background: var(--card); display: grid; gap: 10px; }
.status { font-family: var(--mono); font-size: 0.74rem; line-height: 1.7; color: var(--text-2); }
.status b { color: var(--text); font-weight: 700; }
.test {
  width: 100%;
  min-height: 64px;
  padding: 12px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--raise);
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  text-align: left;
  display: grid;
  grid-template-columns: 36px 1fr;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.test:active { transform: scale(0.98); }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.board button { min-height: 52px; padding: 8px 14px; border: 0; border-radius: 999px; background: var(--raise); color: var(--text); font: inherit; font-size: 0.9rem; cursor: pointer; }
.board button:active { transform: scale(0.97); background: var(--fill); color: var(--on-fill); }
.board .wide { grid-column: 1 / -1; }
.test .n { width: 36px; height: 36px; border-radius: 999px; background: var(--fill); color: var(--on-fill); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; }
.test small { display: block; color: var(--text-2); font-size: 0.8rem; margin-top: 2px; }
#log { font-family: var(--mono); font-size: 0.7rem; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <p class="mono">Cotizador Bong · sonidos</p>
  <h1>Sonidos</h1>
  <p>Cada botón toca un sonido del cotizador tal cual suena en la app. Sacá el modo silencio y probá con auriculares y con el parlante.</p>

  <div class="card">
    <p class="mono">Del cotizador</p>
    <div class="board" id="board">
      <button type="button" data-sound="tick">Tocar un botón</button>
      <button type="button" data-sound="chipOn">Prender un extra</button>
      <button type="button" data-sound="toggleRight">Selector → derecha</button>
      <button type="button" data-sound="toggleLeft">Selector ← izquierda</button>
      <button type="button" data-sound="up">Precio sube</button>
      <button type="button" data-sound="down">Precio baja</button>
      <button type="button" data-sound="stepForward">Avanzar de paso</button>
      <button type="button" data-sound="stepBack">Volver de paso</button>
      <button type="button" data-sound="chipOff">Apagar un extra</button>
      <button type="button" data-sound="confirm">Exportar PDF</button>
      <button type="button" data-sound="sequence" class="wide">Secuencia: elegir una opción</button>
    </div>
  </div>

  <p class="mono">Diagnóstico</p>
  <p>Si el cotizador no suena, tocá estos cuatro <b>en orden</b> y anotá cuáles sonaron.</p>

  <div class="card status" id="status">Cargando…</div>

  <button class="test" type="button" data-test="1"><span class="n">1</span><span>Como el cotizador<small>Web Audio, sesión "ambient", volumen normal</small></span></button>
  <button class="test" type="button" data-test="2"><span class="n">2</span><span>Igual pero fuerte<small>Web Audio, sesión "ambient", volumen ×10</small></span></button>
  <button class="test" type="button" data-test="3"><span class="n">3</span><span>Ignorando el modo silencio<small>Web Audio, sesión "playback", fuerte</small></span></button>
  <button class="test" type="button" data-test="4"><span class="n">4</span><span>Audio clásico<small>Elemento &lt;audio&gt;, no usa Web Audio</small></span></button>

  <div class="card"><p class="mono">Registro</p><div id="log"></div></div>
</main>

<script type="module">
import { Sound, initSound } from "./sound.js?v=35";

// Mismo modulo que la app. El primer toque destraba el audio; ese primer
// sonido espera un instante a que el contexto arranque.
initSound();
Sound.setEnabled(true);
let warmed = false;
const board = {
  tick: () => Sound.tick(),
  chipOn: () => Sound.chip(true),
  chipOff: () => Sound.chip(false),
  toggleRight: () => Sound.toggle(true),
  toggleLeft: () => Sound.toggle(false),
  up: () => Sound.up(),
  down: () => Sound.down(),
  stepForward: () => Sound.step(true),
  stepBack: () => Sound.step(false),
  confirm: () => Sound.confirm(),
  // Lo que se oye al elegir una opcion en un selector: tick, llega la
  // pastilla a los 200ms, termina de rodar el precio a los ~530ms.
  sequence: () => {
    Sound.tick();
    setTimeout(() => Sound.toggle(true), 200);
    setTimeout(() => Sound.up(), 530);
  }
};
document.querySelectorAll("[data-sound]").forEach((b) => b.addEventListener("click", () => {
  const play = board[b.dataset.sound];
  if (warmed) play();
  else setTimeout(() => { warmed = true; play(); }, 120);
}));

(() => {
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  let ctx = null;

  const log = (msg) => { logEl.textContent += `${new Date().toLocaleTimeString("es-AR")}  ${msg}\n`; };

  function status() {
    const session = navigator.audioSession ? navigator.audioSession.type : "no existe";
    statusEl.innerHTML = [
      `Web Audio: <b>${window.AudioContext || window.webkitAudioContext ? "sí" : "no"}</b>`,
      `Estado del audio: <b>${ctx ? ctx.state : "sin crear"}</b>`,
      `Sesión de audio (Safari): <b>${session}</b>`,
      `Frecuencia de muestreo: <b>${ctx ? ctx.sampleRate + " Hz" : "—"}</b>`,
      `Navegador: <b>${(navigator.userAgent.match(/(iPhone OS [\d_]+|Android [\d.]+|Version\/[\d.]+|CriOS\/[\d.]+|Chrome\/[\d.]+)/g) || ["?"]).join(" · ")}</b>`
    ].join("<br>");
  }

  function getCtx() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      ctx = new C();
      ctx.onstatechange = () => { log(`estado → ${ctx.state}`); status(); };
      log(`contexto creado, estado ${ctx.state}`);
    }
    return ctx;
  }

  function setSession(type) {
    if (!navigator.audioSession) { log(`audioSession no existe (no se pudo poner "${type}")`); return; }
    try { navigator.audioSession.type = type; log(`sesión → ${navigator.audioSession.type}`); }
    catch (e) { log(`no se pudo poner la sesión "${type}": ${e.message}`); }
  }

  // Dos notas cortas, lo mismo que el doble blip del cotizador.
  function blip(gain) {
    const c = getCtx();
    const play = () => {
      const t = c.currentTime + 0.02;
      [523.25, 783.99].forEach((freq, i) => {
        const osc = c.createOscillator();
        const env = c.createGain();
        osc.frequency.value = freq;
        env.gain.setValueAtTime(0.0001, t + i * 0.09);
        env.gain.exponentialRampToValueAtTime(gain, t + i * 0.09 + 0.005);
        env.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.18);
        osc.connect(env).connect(c.destination);
        osc.start(t + i * 0.09);
        osc.stop(t + i * 0.09 + 0.2);
      });
      log(`tocado con volumen ${gain} (estado ${c.state})`);
    };
    if (c.state !== "running") {
      log(`estado ${c.state}, reanudando…`);
      c.resume().then(play, (e) => log(`no se pudo reanudar: ${e.message}`));
    } else {
      play();
    }
    status();
  }

  // WAV armado a mano: no depende de Web Audio ni de archivos externos.
  function wavUrl() {
    const rate = 22050, dur = 0.35, n = Math.floor(rate * dur);
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const env = Math.min(1, i / 200) * Math.exp(-i / (rate * 0.12));
      v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 659.25 * i / rate) * env * 0.5 * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  const tests = {
    1: () => { setSession("ambient"); blip(0.035); },
    2: () => { setSession("ambient"); blip(0.35); },
    3: () => { setSession("playback"); blip(0.35); },
    4: () => {
      const audio = new Audio(wavUrl());
      audio.play().then(() => log("<audio> reproduciendo"), (e) => log(`<audio> falló: ${e.name} ${e.message}`));
    }
  };

  document.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => {
    log(`— prueba ${b.dataset.test} —`);
    try { tests[b.dataset.test](); } catch (e) { log(`error: ${e.message}`); }
  }));

  status();
  log("listo");
})();
</script>
</body>
</html>
