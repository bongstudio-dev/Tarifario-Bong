  /* Pantalla llena desde el arranque: solo el juego, de noche. */
  :root { color-scheme: dark; --bg: #000000; --ink: #e9e5f0; --muted: #8d8ca6; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #screen {
    position: fixed; inset: 0; background: var(--bg);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  canvas#game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .nogl { padding: 24px 16px; color: var(--muted); font-size: 14px; max-width: 60ch; }
  .legacy { display: none; }

  "use strict";

  // --- Ajustes de la técnica (los mismos que en las láminas) -----------------
  const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
  const STAR_CHARS = ".+*";
  const ADJ = { amount: 0.6, contrast: 1.8, exposure: 0.9, gamma: 2, threshold: 0.17 };
  const DENSITY = { "Baja": 60, "Intermedia": 75, "Media": 90, "Alta": 120 };
  const MODES = { "Color": null, "Tinta": "#e9e5f0" };
  const SS = 2;
  const TAU = Math.PI * 2;
  const CELL = 8;          // una cuadra del laberinto, en metros
  const HUD = "#ffb45c";

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function hash(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const h3 = (x, y, z) => hash(x + Math.imul(z, 7919), y + Math.imul(z, 104729));
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    let r = 0;
    for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
      r += (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w) * h3(xi + dx, yi + dy, zi + dz);
    }
    return r;
  }
  const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0 }, extra || {}));

  // --- El Arlequín -------------------------------------------------------------
  // Golf de tercera generación, tres puertas, con los paneles de cuatro colores.
  // Medidas en metros: el frente mira a +x, el piso es y = 0, el ancho va en z.
  const HQ = { rojo: "#c8102e", azul: "#1f4fa0", amarillo: "#f2c200", verde: "#2f9a4a" };
  // En el shader van más luminosos que los de la paleta: la grilla toma la luz del canal más
  // fuerte, y un azul o un verde oscuros quedarían por debajo del umbral de negro.
  const GLSL_COLORS = `
    const vec3 ROJO = vec3(1.0, 0.04, 0.07);
    const vec3 AZUL = vec3(0.10, 0.30, 1.0);
    const vec3 AMARILLO = vec3(1.0, 0.70, 0.02);
    const vec3 VERDE = vec3(0.10, 0.85, 0.20);
  `;
  const GLSL_PANELS = GLSL_COLORS + `
    vec3 panelColor(vec3 p) {
      bool der = p.z > 0.0;
      #ifdef CABINA
        bool lateral = abs(p.z) > 0.5;
        bool pilarB = lateral && p.x > -0.44 && p.x < -0.30;
        bool pilarC = lateral && p.x < -1.22;
        if (p.y > 1.00 && p.y < 1.33 && !pilarB && !pilarC) return vec3(0.004, 0.006, 0.012);
        return AZUL;
      #else
        if (p.x > 1.93) return AMARILLO;
        if (p.x < -1.93) return VERDE;
        if (p.x > 0.92 && p.y > 0.84 && abs(p.z) < 0.72) return ROJO;
        if (p.x > 0.92) return der ? VERDE : AMARILLO;
        if (p.x > -0.36) return der ? ROJO : AZUL;
        return der ? AMARILLO : ROJO;
      #endif
    }
  `;
  function harlequinMat(cabina) {
    const m = mat(0xffffff, { roughness: 0.38, metalness: 0.05 });
    if (cabina) m.defines = { CABINA: "" };
    m.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader
        .replace("#include <common>", "#include <common>\nvarying vec3 vObj;")
        .replace("#include <begin_vertex>", "#include <begin_vertex>\nvObj = position;");
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", "#include <common>\nvarying vec3 vObj;\n" + GLSL_PANELS)
        .replace("vec4 diffuseColor = vec4( diffuse, opacity );", "vec4 diffuseColor = vec4( panelColor(vObj), opacity );");
    };
    return m;
  }

  // Llanta fifteen52: disco blanco tipo turbina, con ranuras curvas y centro chico.
  function rimTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    g.translate(128, 128);
    g.fillStyle = "#f4f4f2";
    g.beginPath(); g.arc(0, 0, 128, 0, TAU); g.fill();
    g.fillStyle = "#101010";
    for (let k = 0; k < 5; k++) {
      g.save();
      g.rotate((k / 5) * TAU);
      g.beginPath();
      g.moveTo(34, -6);
      g.quadraticCurveTo(80, -40, 108, -20);
      g.quadraticCurveTo(100, 18, 70, 30);
      g.quadraticCurveTo(52, 10, 34, 8);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.fillStyle = "#cfcfcf";
    g.beginPath(); g.arc(0, 0, 22, 0, TAU); g.fill();
    return new THREE.CanvasTexture(c);
  }

  // El mundo se degenera a medida que se genera: cada pedazo nuevo sale un poco más roto.

    const g = new THREE.Group();

    for (let j = 0; j < CHUNK; j++) for (let i = 0; i < CHUNK; i++) {
      const x = cx * CHUNK + i, y = cy * CHUNK + j, t = cellType(x, y);
      const x0 = x * CELL, z0 = y * CELL;
      const ideaChance = { 1: 0.03, 2: 0.02, 3: 0.1, 4: 0.04, 5: 0.045, 6: 0.07, 7: 0.04, 8: 0.08, 9: 0.12, 14: 0.06 }[t] || 0;
      const key = x + "," + y;
      if (ideaChance && hs(x, y, 20) < ideaChance && !collected.has(key)) ideas.push([key, x0 + 2 + hs(x, y, 21) * 4, z0 + 2 + hs(x, y, 22) * 4, hs(x, y, 23)]);
      if (t === T.VOID) continue;
      if (t === T.SEA) {
        const S = 4, d = CELL / S;
        for (let b = 0; b < S; b++) for (let a = 0; a < S; a++) {
          const ax = x0 + a * d, az = z0 + b * d;
          wp.push(ax, -0.35, az, ax, -0.35, az + d, ax + d, -0.35, az, ax + d, -0.35, az, ax, -0.35, az + d, ax + d, -0.35, az + d);

      }

      if (!(degen > 0 && hs(x, y, 140) < degen * 0.22 && t !== T.MONUMENT)) quad(x0, z0, x0 + CELL, z0 + CELL, 0, FLOOR_COLORS[t]);
      if (t === T.STREET || t === T.AVENUE) {
        // Donde la calle termina (un edificio, el mar, la nada) va una línea y un mojón.
        const edge = (a, b) => { const n = cellType(x + a, y + b); return SOLID(n) || n === T.VOID; };
        const along = [1.33, 4, 6.67];
        if (hs(x, y, 150) < degen * 0.5) { /* tachas que faltan */ } else if (edge(1, 0)) { quad(x0 + 7.35, z0, x0 + 7.5, z0 + CELL, 0.02, 0xbdb6a6); along.forEach(a => studs.push([x0 + 6.9, z0 + a])); }
        if (edge(-1, 0)) { quad(x0 + 0.5, z0, x0 + 0.65, z0 + CELL, 0.02, 0xbdb6a6); along.forEach(a => studs.push([x0 + 1.1, z0 + a])); }
        if (edge(0, 1)) { quad(x0, z0 + 7.35, x0 + CELL, z0 + 7.5, 0.02, 0xbdb6a6); along.forEach(a => studs.push([x0 + a, z0 + 6.9])); }
        if (edge(0, -1)) { quad(x0, z0 + 0.5, x0 + CELL, z0 + 0.65, 0.02, 0xbdb6a6); along.forEach(a => studs.push([x0 + a, z0 + 1.1])); }

  try { cap = clamp(parseFloat(localStorage.getItem("deriva-luz")) || 1, 1, 4); } catch (e) { /* sin almacenamiento */ }

  const orbit = new THREE.Group();
  scene.add(orbit);

  // Busca una cuadra adentro de la nada (con nada alrededor) cerca del auto.

    const sx0 = toCell(player.x), sy0 = toCell(player.z);

    exposureNow = title || (ending && ending.t > 5) ? ADJ.exposure : ADJ.exposure * (0.72 + 0.28 * Math.min(1, light)) * (1 + flash * 0.7 + near * 0.9 + (ending ? ending.t * 1.5 : 0)) * (sinking ? Math.max(0.05, 1 - sinking.t / 2.4) : 1);
    const W = cols * SS, H = rows * SS;
    cullChunks();
    renderer.setRenderTarget(rt);
    renderer.clear();
    // En el final se ve solo el Arlequín girando en el negro.
    if (title || (ending && ending.t > 5)) renderer.render(endScene, endCam); else renderer.render(scene, camera);
    readPixelsAsync(W, H);
    renderer.setRenderTarget(null);
    const steps = RAMP.length - 1, ink = MODES[state.mode];
    for (let ri = 0; ri < rows; ri++) {
      const y0 = (rows - 1 - ri) * SS;
      for (let ci = 0; ci < cols; ci++) {
        let r = 0, g = 0, b = 0, a = 0;
        for (let sy = 0; sy < SS; sy++) for (let sx = 0; sx < SS; sx++) {
          const k = ((y0 + sy) * W + ci * SS + sx) * 4;
          r += buf[k]; g += buf[k + 1]; b += buf[k + 2]; a += buf[k + 3];
        }
        const n = SS * SS, i = ri * cols + ci;
        r /= n; g /= n; b /= n;
        A[i] = a / n > 8 ? 1 : 0;
        const raw = Math.max(r, g, b) / 255;
        let l = clamp((raw * exposureNow - 0.5) * ADJ.contrast + 0.5, 0, 1);
        l = Math.pow(l, ADJ.gamma);
        if (raw < 0.004 || l < ADJ.threshold) { CH[i] = null; continue; }
        const off = hash(ci * 3 + 11, ri * 5 + 7) - 0.5;
        const q = clamp(Math.round((l + (off * ADJ.amount) / steps) * steps), 0, steps);
        CH[i] = RAMP[q];
        if (ink) { COL[i] = ink; continue; }
        const m = Math.max(r, g, b) || 1, kk = (150 + 105 * (q / steps)) / m;
        COL[i] = rgbStr(Math.min(255, r * kk | 0), Math.min(255, g * kk | 0), Math.min(255, b * kk | 0));
      }
    }
    // Cielo: estrellas quietas solo donde no hay nada adelante.
    const streak = state.view === "Arriba" ? 0 : clamp((player.speed - 9) / 12, 0, 1);
    for (let ri = 0; ri < rows; ri++) for (let ci = 0; ci < cols; ci++) {
      const i = ri * cols + ci;
      if (CH[i] || A[i]) continue;
      const s = star(ci, ri, clock);
      if (s < 0) continue;
      CH[i] = STAR_CHARS[clamp(Math.floor(s * 3), 0, 2)]; COL[i] = "#dfe6ff";
      // Rápido, las estrellas se vuelven trazos que salen del centro.
      if (streak > 0 && hash(ci + 5, ri + 17) < streak) {
        const dx = (ci - cols / 2) * 0.6, dy = ri - rows * 0.45, n = Math.hypot(dx, dy) || 1;
        CH[i] = Math.abs(dx / n) > 0.92 ? "-" : Math.abs(dy / n) > 0.92 ? "|" : dx * dy > 0 ? "\\" : "/";
      }
    }
  }


  // El mapa de lo recorrido, como el automapa de Doom: paredes rojas, calles vistas.
  const MAP_STYLE = {
    [T.WALL]: ["##", "#e0463c"], [T.IVY]: ["&&", "#8fd26a"], [T.SEA]: ["~~", "#4a86e8"], [T.MONUMENT]: ["!!", "#e8e4f0"],
    [T.STREET]: ["· ", "#4a4f78"], [T.AVENUE]: ["= ", "#6d73a8"], [T.PLAZA]: [", ", "#5f8a4f"], [T.SAND]: [". ", "#d9c8a0"], [T.FOREST]: ['" ', "#9ad0a0"], [T.MOUNTAIN]: ["^^", "#8a9a7a"], [T.ROAD]: ["= ", "#b08a5a"], [T.BRIDGE]: ["==", "#ffe2a8"], [T.PARK]: ["* ", "#ff4ab0"], [T.FERRIS]: ["@@", "#40e0ff"]
  };
  function automap() {
    CH.fill(null);
    const cw = 2, halfW = Math.floor(cols / cw / 2), halfH = Math.floor((rows - 2) / 2);
    const px = toCell(player.x), pz = toCell(player.z), midC = Math.floor(cols / 2), midR = Math.floor(rows / 2);
    const isSeen = (x, y) => seen.has(x + "," + y);
    for (let dy = -halfH; dy <= halfH; dy++) for (let dx = -halfW; dx < halfW; dx++) {
      const x = px + dx, y = pz + dy;
      let near = false;
      for (let b = -1; b <= 1 && !near; b++) for (let a = -1; a <= 1; a++) if (isSeen(x + a, y + b)) { near = true; break; }
      if (!near) continue;
      const t = cellType(x, y);
      if (!SOLID(t) && !isSeen(x, y)) continue;
      const st = MAP_STYLE[t];
      if (!st) continue;
      const r = midR + dy, c = midC + dx * cw;
      for (let k = 0; k < 2; k++) {
        if (r < 1 || r >= rows - 1 || c + k < 0 || c + k >= cols || st[0][k] === " ") continue;
        CH[r * cols + c + k] = st[0][k]; COL[r * cols + c + k] = st[1];
      }
    }
    const a = ((player.heading % TAU) + TAU) % TAU;
    const arrow = a < Math.PI / 4 || a > 7 * Math.PI / 4 ? ">" : a < 3 * Math.PI / 4 ? "^" : a < 5 * Math.PI / 4 ? "<" : "v";
    // Las ideas que todavía no juntaste, cerca de lo recorrido.
    chunks.forEach(ch => ch.ideas.forEach(it => {
      if (it.taken) return;
      const x = toCell(it.x), y = toCell(it.z), dx = x - px, dy = y - pz;
      if (Math.abs(dx) >= halfW || Math.abs(dy) > halfH || !(isSeen(x, y) || isSeen(x + 1, y) || isSeen(x - 1, y) || isSeen(x, y + 1) || isSeen(x, y - 1))) return;
      const i = (midR + dy) * cols + midC + dx * cw;
      if (midR + dy >= 1 && midR + dy < rows - 1) { CH[i] = "*"; COL[i] = "#fff1c4"; }
    }));
    CH[midR * cols + midC] = arrow; COL[midR * cols + midC] = "#f2c200";
  }

  function dashboard() {
    const AMBER = "#ff9a3c", DIM = "#6e3c1c";
    const top = Math.floor(rows * 0.72);
    for (let r = top; r < rows; r++) for (let c = 0; c < cols; c++) { CH[r * cols + c] = null; }
    for (let c = 0; c < cols; c++) { CH[top * cols + c] = "_"; COL[top * cols + c] = DIM; }
    const R = Math.max(3, Math.floor((rows - top) * 0.42));
    const gauge = (cx, cy, v) => {
      // Arco de 225° a -45°, con marcas; la aguja apunta según el valor (0 a 1).
      for (let a = 0; a <= 1.0001; a += 1 / (R * 5)) {
        const ang = (225 - 270 * a) * Math.PI / 180;
        const c = Math.round(cx + Math.cos(ang) * R / 0.6), r = Math.round(cy - Math.sin(ang) * R);
        if (r > top && r < rows && c >= 0 && c < cols) { CH[r * cols + c] = a <= v ? "·" : "."; COL[r * cols + c] = a <= v ? AMBER : DIM; }
      }
      const ang = (225 - 270 * clamp(v, 0, 1)) * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
      const ch = Math.abs(ca) > 0.92 ? "-" : Math.abs(sa) > 0.92 ? "|" : ca * sa > 0 ? "/" : "\\";
      for (let k = 0; k < R - 0.5; k += 0.5) {
        const c = Math.round(cx + ca * k / 0.6), r = Math.round(cy - sa * k);
        if (r > top && r < rows && c >= 0 && c < cols) { CH[r * cols + c] = ch; COL[r * cols + c] = AMBER; }
      }
      CH[cy * cols + cx] = "o"; COL[cy * cols + cx] = AMBER;
    };
    const cy = Math.min(rows - 1, top + R + 1);
    gauge(Math.round(cols * 0.3), cy, player.speed / MAX_FWD);
    gauge(Math.round(cols * 0.7), cy, light / cap);
  }

  function hud() {
    if (title) { titleScreen(); return; }
    if (ending) return;
    hudBase();
    overlay();
  }
  function hudBase() {
    if (state.view === "Adentro" && !state.map) dashboard();
    const write = (text, r, align) => {
      const c0 = align === "right" ? cols - text.length - 1 : align === "center" ? Math.floor((cols - text.length) / 2) : 1;
      for (let k = 0; k < text.length; k++) {
        const c = c0 + k;
        if (c < 0 || c >= cols) continue;
        CH[r * cols + c] = text[k] === " " ? null : text[k];
        COL[r * cols + c] = HUD;
      }
    };
    // Antes de moverse, una sola flecha que titila arriba del auto.
    if (!started && Math.sin(clock * 5) > -0.2 && !state.map) {
      const i = Math.floor(rows * 0.3) * cols + Math.floor(cols / 2);
      CH[i] = "↑"; COL[i] = HUD;
    }
    if (whisper && clock < whisper.until) {
      for (let k = 0; k < whisper.text.length; k++) {
        const i = whisper.r * cols + whisper.c + k;
        if (whisper.text[k] !== " ") { CH[i] = whisper.text[k]; COL[i] = "#9a8fa8"; }
      }
    }
    if (msg && clock < msgUntil) {
      const pad = " " + msg + " ";
      const r = Math.floor(rows / 2);
      // El mensaje limpia su fila para leerse sobre la escena.
      for (let c = Math.floor((cols - pad.length) / 2); c < Math.floor((cols + pad.length) / 2); c++) if (c >= 0 && c < cols) CH[r * cols + c] = null;
      const shown = voidK < 0.3 ? pad : pad.replace(/[^ ]/g, ch => Math.random() < 0.25 * voidK ? RAMP[1 + Math.floor(Math.random() * (RAMP.length - 1))] : ch);
      write(shown, r, "center");
    }
  }

  // La letra se ajusta para que su avance mida exactamente una celda; así cada tramo del mismo
  // color se dibuja de una sola vez y queda alineado a la grilla.
  const FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  let fontFor = { w: 0, px: 0 };
  function paint() {
    const cw = canvas.width / cols, chh = canvas.height / rows;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (fontFor.w !== cw) {
      ctx.font = '100px ' + FONT;
      const adv = ctx.measureText("MMMMMMMMMM").width / 1000;
      fontFor = { w: cw, px: Math.min(chh * 1.05, cw / adv) };
    }
    ctx.font = fontFor.px.toFixed(2) + 'px ' + FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (let ri = 0; ri < rows; ri++) {
      const y = (ri + 0.5) * chh, o = ri * cols;
      let start = -1, color = null, run = "";
      for (let ci = 0; ci <= cols; ci++) {
        const ch = ci < cols ? CH[o + ci] : null;
        const c = ch ? COL[o + ci] : null;
        if (ch && start >= 0 && c === color) { run += ch; continue; }
        if (ch && start >= 0 && c !== color) {
          ctx.fillStyle = color; ctx.fillText(run, start * cw, y);
          start = ci; color = c; run = ch; continue;
        }
        if (ch) { start = ci; color = c; run = ch; continue; }
        // Celda vacía: sigue el tramo con un espacio, salvo al final de la fila.
        if (start >= 0 && ci < cols) { run += " "; continue; }
        if (start >= 0) { ctx.fillStyle = color; ctx.fillText(run.replace(/ +$/, ""), start * cw, y); start = -1; run = ""; }
      }
    }
  }


  // --- Controles ---------------------------------------------------------------------------------
  const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "hand" };
  let engaged = false;
  // --- Controles hechos de caracteres: volante, freno y menú -----------------------------------
  // Deslizás el dedo de costado para doblar; el botón de abajo a la derecha frena.
  const CRUISE = 17.5;
  const steerT = { active: false, id: null, x0: 0, y0: 0, px: 0, x: 0 };
  const brake = { held: false, id: null }, gas = { held: false, id: null };
  const menu = { open: false, rows: [], box: null };
  const AMBER = "#ff9a3c", DIM = "#6e3c1c", MUTED = "#8d8ca6";
  const cellOf = e => {
    const r = canvas.getBoundingClientRect();
    return { c: Math.floor((e.clientX - r.left) / r.width * cols), r: Math.floor((e.clientY - r.top) / r.height * rows), px: e.clientX - r.left, py: e.clientY - r.top, w: r.width, h: r.height };
  };
  const put = (r, c, ch, color) => { if (r >= 0 && r < rows && c >= 0 && c < cols) { CH[r * cols + c] = ch; COL[r * cols + c] = color; } };
  const text = (r, c, str, color) => { for (let k = 0; k < str.length; k++) put(r, c + k, str[k] === " " ? null : str[k], color); };
  // Cajas: el botón del menú arriba a la derecha y el freno abajo a la derecha.
  const MENU_BOX = () => ({ top: 1, left: cols - 9, h: 3, w: 7 });
  // Otro mundo, al lado del menú: siempre a mano para cambiar de ciudad de un toque.
  const WORLD_BOX = () => ({ top: 1, left: cols - 17, h: 3, w: 7 });
  const world = { tapBtn: false, flash: -9 };
  const otherWorld = () => { newWorld((Math.random() * 1e9) | 0); world.flash = clock; };
  const BRAKE_BOX = () => ({ top: rows - 8, left: cols - 14, h: 6, w: 12 });
  // Sin autoavance aparece el acelerador, arriba del freno.
  const GAS_BOX = () => ({ top: rows - 15, left: cols - 14, h: 6, w: 12 });
  const inside = (p, b, pad) => p.r >= b.top - pad && p.r < b.top + b.h + pad && p.c >= b.left - pad && p.c < b.left + b.w + pad;
  function drawBox(b, color, fill) {
    for (let r = b.top; r < b.top + b.h; r++) for (let c = b.left; c < b.left + b.w; c++) put(r, c, fill || null, color);
    const R = b.top + b.h - 1, C = b.left + b.w - 1;
    put(b.top, b.left, "╭", color); put(b.top, C, "╮", color); put(R, b.left, "╰", color); put(R, C, "╯", color);
    for (let c = b.left + 1; c < C; c++) { put(b.top, c, "─", color); put(R, c, "─", color); }
    for (let r = b.top + 1; r < R; r++) { put(r, b.left, "│", color); put(r, C, "│", color); }
  }

  function menuItems() {
    const cyc = (list, v) => list[(list.indexOf(v) + 1) % list.length];
    return [
      { label: "AUTOAVANCE", value: state.auto ? "SÍ" : "NO", act: () => { state.auto = !state.auto; } },
      { label: "FRENO AUTO", value: state.assist ? "SÍ" : "NO", act: () => { state.assist = !state.assist; } },
      { label: "CÁMARA", value: state.view.toUpperCase(), act: () => setOpt("view", cyc(VIEWS, state.view)) },
      { label: "DENSIDAD", value: state.density.toUpperCase(), act: () => setOpt("density", cyc(Object.keys(DENSITY), state.density)) },
      { label: "DISTANCIA", value: state.dist.toUpperCase(), act: () => { state.dist = cyc(Object.keys(DIST), state.dist); } },
      { label: "MODO", value: state.mode.toUpperCase(), act: () => setOpt("mode", cyc(Object.keys(MODES), state.mode)) },
      { label: "GIROSCOPIO", value: gyro.on ? "SÍ" : gyroBtn.dataset.failed ? "NO HAY" : "NO", act: () => gyroBtn.click() },
      { label: "MAPA", value: state.map ? "SÍ" : "NO", act: () => setOpt("map", !state.map) },
      { label: "PANTALLA", value: document.fullscreenElement ? "COMPLETA" : "NORMAL", act: () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (err) { /* sin pantalla completa */ } } },
      { label: "OTRA CIUDAD", value: "", act: () => { otherWorld(); menu.open = false; } },
      { label: "SEGUIR", value: "", act: () => { menu.open = false; } }
    ];
  }

  function overlay() {
    if (!menu.open) {
      const m = MENU_BOX();
      drawBox(m, MUTED);
      text(m.top + 1, m.left + 3, "≡", AMBER);
      const w = WORLD_BOX(), lit = clock - world.flash < 0.4 || world.tapBtn;
      drawBox(w, lit ? AMBER : MUTED, lit ? "░" : null);
      text(w.top + 1, w.left + 3, "↻", lit ? "#fff1c4" : AMBER);
    }
    if (menu.open || state.map) { if (!menu.open) return; }
    else {
      // Los botones de pedal solo en pantallas táctiles; en la compu están las flechas.
      const b = BRAKE_BOX();
      if (touchDevice) {
        drawBox(b, brake.held ? AMBER : DIM, brake.held ? "░" : null);
        text(b.top + Math.floor(b.h / 2) - 1, b.left + Math.floor(b.w / 2) - 1, "▼", brake.held ? "#fff1c4" : AMBER);
      }
      if (!state.auto && touchDevice) {
        const g = GAS_BOX();
        drawBox(g, gas.held ? AMBER : DIM, gas.held ? "░" : null);
        text(g.top + Math.floor(g.h / 2) - 1, g.left + Math.floor(g.w / 2) - 1, "▲", gas.held ? "#fff1c4" : AMBER);
      }
      // Volante: una barra con la perilla donde está el dedo. Antes del primer toque, un fantasma que va y viene.
      const ghost = !started && touchDevice;
      if (steerT.active || ghost) {
        const rect = canvas.getBoundingClientRect(), cw = rect.width / cols, chh = rect.height / rows;
        const R = Math.min(rect.width, rect.height) * 0.22;
        const x0 = steerT.active ? steerT.x0 : rect.width * 0.4, y0 = steerT.active ? steerT.y0 : rect.height * 0.82;
        const kx = steerT.active ? -steerT.x : Math.sin(clock * 2.4) * 0.8;
        const row = Math.round(y0 / chh - 0.5), c0 = Math.round((x0 - R) / cw), c1 = Math.round((x0 + R) / cw);
        for (let c = c0; c <= c1; c++) put(row, c, "─", ghost ? DIM : "#a0582a");
        put(row, c0 - 1, "‹", ghost ? DIM : AMBER); put(row, c1 + 1, "›", ghost ? DIM : AMBER);
        const kc = Math.round((x0 + kx * R) / cw - 0.5);
        put(row, kc - 1, "(", AMBER); put(row, kc, "@", AMBER); put(row, kc + 1, ")", AMBER);
      }
      return;
    }
    if (!menu.open) return;
    // Menú: una caja de líneas en el centro de la grilla.
    const items = menuItems();
    const inner = Math.min(cols - 4, Math.max(26, ...items.map(it => it.label.length + it.value.length + 6)));
    const h = items.length + 4, top = Math.max(1, Math.floor((rows - h) / 2)), left = Math.floor((cols - inner - 2) / 2);
    for (let r = top; r < top + h; r++) for (let c = left; c < left + inner + 2; c++) put(r, c, null, AMBER);
    put(top, left, "┌", DIM); put(top, left + inner + 1, "┐", DIM); put(top + h - 1, left, "└", DIM); put(top + h - 1, left + inner + 1, "┘", DIM);
    for (let c = left + 1; c <= left + inner; c++) { put(top, c, "─", DIM); put(top + h - 1, c, "─", DIM); }
    for (let r = top + 1; r < top + h - 1; r++) { put(r, left, "│", DIM); put(r, left + inner + 1, "│", DIM); }
    text(top, left + 2, " DERIVA ", AMBER);
    menu.rows = [];
    items.forEach((it, k) => {
      const r = top + 2 + k;
      text(r, left + 2, it.label, it.value ? MUTED : AMBER);
      if (it.value) text(r, left + inner - it.value.length - 3, "‹" + it.value + "›", AMBER);
      menu.rows.push({ r, act: it.act });
    });
    menu.box = { top, left, bottom: top + h - 1, right: left + inner + 1 };
  }

  // --- Pantalla de título -------------------------------------------------------------------
  let title = true;
  const BIG = {
    D: ["████ ", "█   █", "█   █", "█   █", "████ "],
    E: ["█████", "█    ", "████ ", "█    ", "█████"],
    R: ["████ ", "█   █", "████ ", "█  █ ", "█   █"],
    I: ["█████", "  █  ", "  █  ", "  █  ", "█████"],
    V: ["█   █", "█   █", "█   █", " █ █ ", "  █  "],
    A: [" ███ ", "█   █", "█████", "█   █", "█   █"]
  };
  const CAR_COLORS = ["#ff2a3a", "#3c6bff", "#ffc21a", "#2fe0d0"];
  const PLAY_BOX = () => { const w = 15; return { top: Math.min(rows - 4, Math.round(rows * 0.85)), left: Math.floor((cols - w) / 2), h: 3, w }; };
  function titleScreen() {
    const center = (r, str, color) => text(r, Math.floor((cols - str.length) / 2), str, color);
    // Leyenda arriba.
    center(Math.round(rows * 0.1), "la luz da vida a todo", "#c9b98e");
    // DERIVA en letras grandes: cada bloque es un carácter denso, con un brillo que baja.
    const sc = (cols >= 72 && rows >= 60) || cols >= 110 ? 2 : 1, word = "DERIVA", lw = 6 * sc, top = Math.round(rows * (sc === 2 ? 0.15 : 0.16));
    const left = Math.floor((cols - word.length * lw + sc) / 2);
    for (let k = 0; k < word.length; k++) BIG[word[k]].forEach((line, y) => {
      for (let yy = 0; yy < sc; yy++) for (let x = 0; x < line.length; x++) for (let xx = 0; xx < sc; xx++) {
        if (line[x] === " ") continue;
        const r = top + y * sc + yy, c = left + k * lw + x * sc + xx;
        // Todos caracteres densos; el brillo baja como una luz que recorre las letras.
        const glow = 0.5 + 0.5 * Math.sin(clock * 1.6 - r * 0.45 - c * 0.06);
        put(r, c, glow > 0.66 ? "$" : glow > 0.33 ? "@" : "B", glow > 0.8 ? "#fff6e0" : glow > 0.45 ? "#e9e5f0" : "#b8b4c8");
      }
    });
    // milangagalactica con los colores del auto, con una ola de brillo que la recorre.
    const name = "milangagalactica", nr = Math.round(rows * (rows >= 60 ? 0.74 : 0.8)), nc = Math.floor((cols - name.length) / 2);
    for (let k = 0; k < name.length; k++) put(nr, nc + k, name[k], Math.sin(clock * 2.2 - k * 0.45) > 0.85 ? "#fff6e0" : CAR_COLORS[k % 4]);
    // Botón de jugar que late.
    const b = PLAY_BOX(), on = Math.sin(clock * 3) > -0.3;
    drawBox(b, on ? AMBER : DIM);
    text(b.top + 1, b.left + 4, "▶ JUGAR", on ? "#fff1c4" : AMBER);
  }
  function startGame() { title = false; camSnap = true; }

  canvas.addEventListener("pointerdown", e => {
    engaged = true;
    if (title) { if (inside(cellOf(e), PLAY_BOX(), 3)) startGame(); return; }
    const p = cellOf(e);
    if (!menu.open && inside(p, MENU_BOX(), 1)) { menu.tapBtn = true; return; }
    if (!menu.open && inside(p, WORLD_BOX(), 0)) { world.tapBtn = true; return; }
    if (menu.open) return;
    started = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
    if (inside(p, BRAKE_BOX(), 1)) { brake.held = true; brake.id = e.pointerId; return; }
    if (!state.auto && inside(p, GAS_BOX(), 0)) { gas.held = true; gas.id = e.pointerId; return; }
    if (!steerT.active) { steerT.active = true; steerT.id = e.pointerId; steerT.x0 = p.px; steerT.y0 = p.py; steerT.x = 0; }
  });
  canvas.addEventListener("pointermove", e => {
    if (!steerT.active || e.pointerId !== steerT.id) return;
    const p = cellOf(e), R = Math.min(p.w, p.h) * 0.22;
    // Dedo a la derecha, dobla a la derecha (en el juego, derecha es negativo).
    steerT.x = -clamp((p.px - steerT.x0) / R, -1, 1);
  });
  const endTouch = e => {
    if (menu.tapBtn) { menu.tapBtn = false; if (inside(cellOf(e), MENU_BOX(), 1)) menu.open = true; return; }
    if (world.tapBtn) { world.tapBtn = false; if (inside(cellOf(e), WORLD_BOX(), 1)) otherWorld(); return; }
    if (menu.open) {
      const p = cellOf(e), bx = menu.box;
      if (!bx || p.r < bx.top || p.r > bx.bottom || p.c < bx.left || p.c > bx.right) { menu.open = false; return; }
      const row = menu.rows.find(x => x.r === p.r);
      if (row) row.act();
      return;
    }
    if (e.pointerId === brake.id) { brake.held = false; brake.id = null; }
    if (e.pointerId === gas.id) { gas.held = false; gas.id = null; }
    if (e.pointerId === steerT.id) { steerT.active = false; steerT.x = 0; steerT.id = null; }
  };
  canvas.addEventListener("pointerup", endTouch);
  canvas.addEventListener("pointercancel", e => {
    menu.tapBtn = false; world.tapBtn = false;
    if (e.pointerId === brake.id) { brake.held = false; brake.id = null; }
    if (e.pointerId === gas.id) { gas.held = false; gas.id = null; }
    if (e.pointerId === steerT.id) { steerT.active = false; steerT.x = 0; steerT.id = null; }
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  window.addEventListener("keydown", e => {
    if (title) { if (e.code === "Enter" || e.code === "Space") { startGame(); e.preventDefault(); } return; }
    if (e.code === "Escape") { menu.open = !menu.open; return; }
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; started = true; if (engaged) e.preventDefault(); return; }
    if (e.code === "KeyC") setOpt("view", VIEWS[(VIEWS.indexOf(state.view) + 1) % VIEWS.length]);
    if (e.code === "KeyM") setOpt("map", !state.map);
    if (e.code === "KeyR") otherWorld();
  });
  window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  window.addEventListener("blur", () => Object.keys(keys).forEach(k => { keys[k] = false; }));
  canvas.addEventListener("pointerdown", () => { engaged = true; canvas.focus(); });

  // Giroscopio: el celu horizontal es el volante. Se mide hacia dónde cae la gravedad sobre
  // la pantalla, así no importa cuánto lo inclines hacia atrás.
  const gyro = { on: false, steer: 0, heard: 0 };
  const gyroBtn = document.getElementById("pad-gyro");
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    gyro.heard = performance.now();
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b); // "arriba" del mundo visto en el celu
    const th = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    const sx = ux * Math.cos(th) - uy * Math.sin(th), sy = ux * Math.sin(th) + uy * Math.cos(th);
    let a = Math.atan2(sx, sy) * 180 / Math.PI; // inclinación como volante, en grados
    a = Math.abs(a) < 3 ? 0 : a - Math.sign(a) * 3;
    gyro.steer = clamp(a / 22, -1, 1);
  }
  function setGyro(on) {
    gyro.on = on;
    document.body.classList.toggle("gyro", on);
    gyroBtn.setAttribute("aria-pressed", String(on));
    gyroBtn.textContent = on ? "Giroscopio" : gyroBtn.dataset.failed ? "Sin giroscopio" : "Giroscopio";
  }
  gyroBtn.addEventListener("click", async () => {
    if (gyro.on) { setGyro(false); return; }
    started = true;
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== "granted") throw new Error("denegado");
      }
      window.addEventListener("deviceorientation", onOrient);
      setGyro(true);
      // Si en un segundo y medio no llega nada, este navegador (o el marco) no lo deja.
      setTimeout(() => { if (performance.now() - gyro.heard > 1400) { gyroBtn.dataset.failed = "1"; setGyro(false); } }, 1500);
    } catch (err) { gyroBtn.dataset.failed = "1"; setGyro(false); }
  });

  // Con el giroscopio, la pantalla es el pedal: derecha acelera, izquierda frena.
  const pedal = e => {
    return;
    const r = canvas.getBoundingClientRect();
    const right = e.clientX - r.left > r.width * 0.4;
    keys.up = right; keys.down = !right; started = true;
  };
  canvas.addEventListener("pointerdown", e => { pedal(e); try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ } });
  canvas.addEventListener("pointermove", e => { if (gyro.on && (keys.up || keys.down)) pedal(e); });
  const release = () => { if (gyro.on) { keys.up = keys.down = false; } };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  // Pantalla completa y horizontal, donde se pueda.
  const fullBtn = document.getElementById("pad-full");
  fullBtn.addEventListener("click", async () => {
    const on = !document.body.classList.contains("full");
    document.body.classList.toggle("full", on);
    fullBtn.textContent = on ? "Salir" : "Pantalla completa";
    fullBtn.setAttribute("aria-pressed", String(on));
    // Si el navegador tiene pantalla completa de verdad, la usa además; si no, alcanza con tapar la página.
    try {
      if (!on && document.fullscreenElement) await document.exitFullscreen();
      else if (on && document.documentElement.requestFullscreen) { await document.documentElement.requestFullscreen(); try { await screen.orientation.lock("landscape"); } catch (e) { /* no se puede bloquear */ } }
    } catch (e) { /* sin pantalla completa del navegador */ }
    setTimeout(layout, 200);
  });
  document.addEventListener("fullscreenchange", () => setTimeout(layout, 200));
  canvas.addEventListener("focus", () => { engaged = true; });
  canvas.addEventListener("blur", () => { engaged = false; });

  document.querySelectorAll("#pad button").forEach(btn => {
    const k = btn.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = true; started = true; btn.dataset.down = "true"; try { btn.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ } };
    const off = () => { keys[k] = false; btn.dataset.down = "false"; };
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("lostpointercapture", off);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  const opts = document.getElementById("opts");
  const segs = {};
  function addSeg(label, key, values) {
    const wrap = document.createElement("div");
    wrap.className = "ctl";
    wrap.innerHTML = '<span class="ctl-label" id="lbl-' + key + '">' + label + "</span>";
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-labelledby", "lbl-" + key);
    values.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.id = key + "-" + v;
      b.textContent = v;
      b.addEventListener("click", () => setOpt(key, v));
      seg.appendChild(b);
    });
    wrap.appendChild(seg);
    opts.appendChild(wrap);
    segs[key] = seg;
  }
  const VIEWS = ["Atrás", "Adentro", "Arriba"];
  addSeg("Cámara", "view", VIEWS);
  addSeg("Densidad", "density", Object.keys(DENSITY));
  addSeg("Modo", "mode", Object.keys(MODES));
  const mapBtn = document.createElement("button");
  mapBtn.type = "button"; mapBtn.id = "btn-map";
  mapBtn.addEventListener("click", () => setOpt("map", !state.map));
  const newBtn = document.createElement("button");
  newBtn.type = "button"; newBtn.id = "btn-new"; newBtn.textContent = "Otra ciudad";
  newBtn.addEventListener("click", () => newWorld((Math.random() * 1e9) | 0));
  opts.append(mapBtn, newBtn);

  function setOpt(key, value) {
    state[key] = value;
    Object.keys(segs).forEach(k => segs[k].querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.textContent === state[k]))));
    mapBtn.textContent = state.map ? "Volver a manejar" : "Ver mapa";
    mapBtn.setAttribute("aria-pressed", String(state.map));
    if (key === "density") layout();
    if (key === "view") camSnap = true;
  }

  // --- Bucle ----------------------------------------------------------------------------------------
  let lastTs = 0, lastPaint = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (document.hidden) { lastTs = ts; return; }
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    clock += dt;
    water.uniforms.uTime.value = clock;
    if (title) { endTurn.rotation.y = clock * 0.35; frameEndCam(ratio > 1 ? 0.9 : 0.25); }
    if (!title && !state.map && !menu.open) { if (sinking || ending) { player.x += player.vx * dt; player.z += player.vz * dt; } else physics(dt); tickWater(dt); }
    tickHorizon();
    tickEnding(dt);
    tickLight(dt);
    markSeen();
    trackZone();
    updateChunks(false);
    tickChunks();
    tickCity();
    if (ts - lastPaint < 33) return;
    const pdt = lastPaint ? Math.min(0.1, (ts - lastPaint) / 1000) : 0.033;
    lastPaint = ts;
    placeWorld(pdt);
    placeOrbit();
    tickVoid(pdt);
    placeCamera(pdt);
    if (state.map) automap(); else { shade(); if (voidK > 0.02) glitch(); endingOverlay(); }
    hud();
    paint();
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });

  setOpt("view", state.view);
  layout();
  newWorld((Math.random() * 1e9) | 0);
  const start = () => { layout(); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) document.fonts.load('16px "IBM Plex Mono"', "abc").then(start, start);
  else start();
})();
</script>

</html>
