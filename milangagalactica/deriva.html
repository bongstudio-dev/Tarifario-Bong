<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deriva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Un solo tema a propósito: el juego pasa de noche. */
  :root {
    color-scheme: dark;
    --bg: #0b0d19;
    --ink: #e9e5f0;
    --muted: #8d8ca6;
    --line: #262a40;
    --sun: #ffb45c;
    --plate: #000000;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.55;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: 28px 48px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--sun); margin: 0; }
  h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 500; line-height: 1.1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  canvas#game { display: block; max-width: 100%; border-radius: 3px; background: var(--plate); touch-action: none; outline: none; }
  canvas#game:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

  .pad { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pad-group { display: flex; gap: 10px; }
  .pad button, .opts button {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  .pad button { min-width: 72px; min-height: 60px; padding: 0 16px; font-size: 18px; }
  /* Con mouse y teclado no hacen falta botones en pantalla. */
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  .pad button.tool { min-width: 0; min-height: 44px; font-size: 12px; letter-spacing: .04em; }
  .pad button.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  body.gyro #pad-left, body.gyro #pad-right { display: none; }
  .pad button[data-down="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding-block: 12px; border-block: 1px solid var(--line); width: 100%; }
  .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ctl-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .opts .seg button { border: 0; border-radius: 0; font-size: 12px; padding: 6px 10px; color: var(--muted); }
  .opts .seg button + button { border-left: 1px solid var(--line); }
  .opts .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .opts > button { font-size: 12px; padding: 6px 10px; }
  .pad button:focus-visible, .opts button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  @media (hover: hover) { .opts button:hover, .pad button:hover { border-color: var(--muted); } }

  .nogl { padding: 16px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  /* Celu horizontal: el juego ocupa la pantalla y los controles van al costado. */
  @media (orientation: landscape) and (max-height: 540px) {
    body { padding-block: 6px; padding-inline: 12px; }
    header, .opts { display: none; }
    .stage { flex-direction: row; align-items: center; justify-content: center; gap: 10px; }
    .pad { width: auto; flex-direction: column; flex-wrap: nowrap; align-self: stretch; justify-content: space-between; }
    .pad-group { flex-direction: column; }
  }
  .stage:fullscreen { background: var(--bg); padding: 8px; }
  /* Pantalla llena propia: sirve aunque el navegador no tenga pantalla completa (iPhone). */
  body.full { overflow: hidden; }
  body.full header, body.full .opts { display: none; }
  body.full .stage {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    flex-direction: row; justify-content: center; align-items: center; gap: 10px;
    padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  body.full .pad { display: flex; width: auto; flex-direction: column; flex-wrap: nowrap; align-self: stretch; justify-content: space-between; }
  body.full .pad-group { flex-direction: column; }
  @media (orientation: portrait) {
    body.full .stage { flex-direction: column; }
    body.full .pad { flex-direction: row; flex-wrap: wrap; width: 100%; align-self: auto; }
    body.full .pad-group { flex-direction: row; }
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">milangagalactica</p>
    <h1>Deriva</h1>
  </header>

  <div class="stage">
    <canvas id="game" tabindex="0" role="img" aria-label="Deriva: el Arlequín maneja de noche por una ciudad que no se termina"></canvas>
    <div class="pad" id="pad">
      <div class="pad-group">
        <button type="button" id="pad-left" data-key="left" aria-label="Doblar a la izquierda">◀</button>
        <button type="button" id="pad-right" data-key="right" aria-label="Doblar a la derecha">▶</button>
      </div>
      <div class="pad-group pad-tools">
        <button type="button" id="pad-gyro" class="tool" aria-pressed="false">Giroscopio</button>
        <button type="button" id="pad-full" class="tool">Pantalla completa</button>
      </div>
      <div class="pad-group">
        <button type="button" id="pad-brake" data-key="down" aria-label="Frenar">▼</button>
        <button type="button" id="pad-gas" data-key="up" aria-label="Acelerar">▲</button>
      </div>
    </div>
    <div class="opts" id="opts"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // --- Ajustes de la técnica (los mismos que en las láminas) -----------------
  const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
  const STAR_CHARS = ".+*";
  const ADJ = { amount: 0.6, contrast: 1.8, exposure: 0.9, gamma: 2, threshold: 0.17 };
  const DENSITY = { "Baja": 60, "Intermedia": 75, "Media": 90, "Alta": 120 };
  const MODES = { "Color": null, "Tinta": "#e9e5f0" };
  const SS = 2;
  const TAU = Math.PI * 2;
  const CELL = 8;          // una cuadra del laberinto, en metros
  const HUD = "#ffb45c";

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function hash(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const h3 = (x, y, z) => hash(x + Math.imul(z, 7919), y + Math.imul(z, 104729));
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    let r = 0;
    for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
      r += (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w) * h3(xi + dx, yi + dy, zi + dz);
    }
    return r;
  }
  const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0 }, extra || {}));

  // --- El Arlequín -------------------------------------------------------------
  // Golf de tercera generación, tres puertas, con los paneles de cuatro colores.
  // Medidas en metros: el frente mira a +x, el piso es y = 0, el ancho va en z.
  const HQ = { rojo: "#c8102e", azul: "#1f4fa0", amarillo: "#f2c200", verde: "#2f9a4a" };
  // En el shader van más luminosos que los de la paleta: la grilla toma la luz del canal más
  // fuerte, y un azul o un verde oscuros quedarían por debajo del umbral de negro.
  const GLSL_COLORS = `
    const vec3 ROJO = vec3(1.0, 0.04, 0.07);
    const vec3 AZUL = vec3(0.10, 0.30, 1.0);
    const vec3 AMARILLO = vec3(1.0, 0.70, 0.02);
    const vec3 VERDE = vec3(0.10, 0.85, 0.20);
  `;
  const GLSL_PANELS = GLSL_COLORS + `
    vec3 panelColor(vec3 p) {
      bool der = p.z > 0.0;
      #ifdef CABINA
        bool lateral = abs(p.z) > 0.5;
        bool pilarB = lateral && p.x > -0.44 && p.x < -0.30;
        bool pilarC = lateral && p.x < -1.22;
        if (p.y > 1.00 && p.y < 1.33 && !pilarB && !pilarC) return vec3(0.004, 0.006, 0.012);
        return AZUL;
      #else
        if (p.x > 1.93) return AMARILLO;
        if (p.x < -1.93) return VERDE;
        if (p.x > 0.92 && p.y > 0.84 && abs(p.z) < 0.72) return ROJO;
        if (p.x > 0.92) return der ? VERDE : AMARILLO;
        if (p.x > -0.36) return der ? ROJO : AZUL;
        return der ? AMARILLO : ROJO;
      #endif
    }
  `;
  function harlequinMat(cabina) {
    const m = mat(0xffffff, { roughness: 0.38, metalness: 0.05 });
    if (cabina) m.defines = { CABINA: "" };
    m.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader
        .replace("#include <common>", "#include <common>\nvarying vec3 vObj;")
        .replace("#include <begin_vertex>", "#include <begin_vertex>\nvObj = position;");
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", "#include <common>\nvarying vec3 vObj;\n" + GLSL_PANELS)
        .replace("vec4 diffuseColor = vec4( diffuse, opacity );", "vec4 diffuseColor = vec4( panelColor(vObj), opacity );");
    };
    return m;
  }

  // Llanta fifteen52: disco blanco tipo turbina, con ranuras curvas y centro chico.
  function rimTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    g.translate(128, 128);
    g.fillStyle = "#f4f4f2";
    g.beginPath(); g.arc(0, 0, 128, 0, TAU); g.fill();
    g.fillStyle = "#101010";
    for (let k = 0; k < 5; k++) {
      g.save();
      g.rotate((k / 5) * TAU);
      g.beginPath();
      g.moveTo(34, -6);
      g.quadraticCurveTo(80, -40, 108, -20);
      g.quadraticCurveTo(100, 18, 70, 30);
      g.quadraticCurveTo(52, 10, 34, 8);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.fillStyle = "#cfcfcf";
    g.beginPath(); g.arc(0, 0, 22, 0, TAU); g.fill();
    return new THREE.CanvasTexture(c);
  }

  function buildGolf() {
    const car = new THREE.Group();

    // Carrocería baja: el perfil lateral con los pasarruedas, extruido a lo ancho.
    const s = new THREE.Shape();
    s.moveTo(-1.99, 0.22);
    s.lineTo(-1.59, 0.22); s.lineTo(-1.59, 0.30);
    s.absarc(-1.23, 0.30, 0.36, Math.PI, 0, true);
    s.lineTo(-0.87, 0.22); s.lineTo(0.88, 0.22); s.lineTo(0.88, 0.30);
    s.absarc(1.24, 0.30, 0.36, Math.PI, 0, true);
    s.lineTo(1.60, 0.22); s.lineTo(1.97, 0.25);
    s.lineTo(2.01, 0.55); s.lineTo(1.98, 0.80);
    s.lineTo(0.95, 0.95); s.lineTo(-1.80, 0.98);
    s.lineTo(-1.97, 0.95); s.lineTo(-2.01, 0.55);
    s.closePath();
    const bodyGeo = new THREE.ExtrudeGeometry(s, { depth: 1.58, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 3, curveSegments: 18 });
    bodyGeo.translate(0, 0, -0.79);
    car.add(new THREE.Mesh(bodyGeo, harlequinMat(false)));

    // Cabina: parabrisas, techo y portón; se angosta hacia arriba.
    const c = new THREE.Shape();
    c.moveTo(0.96, 0.92); c.lineTo(-0.02, 1.40); c.lineTo(-1.30, 1.41);
    c.lineTo(-1.90, 1.00); c.lineTo(-1.92, 0.92);
    c.closePath();
    const cabGeo = new THREE.ExtrudeGeometry(c, { depth: 1.42, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 3 });
    cabGeo.translate(0, 0, -0.71);
    const pos = cabGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      pos.setZ(i, pos.getZ(i) * (1 - 0.15 * clamp((y - 0.95) / 0.46, 0, 1)));
    }
    cabGeo.computeVertexNormals();
    car.add(new THREE.Mesh(cabGeo, harlequinMat(true)));

    // Frente: parrilla oscura y los dos faros; atrás, las ópticas rojas.
    const grille = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.62), mat(0x0c0c0c, { roughness: 0.6 }));
    grille.position.set(2.02, 0.66, 0);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ee, emissive: 0xfff4e0, emissiveIntensity: 0, roughness: 0.2 });
    const tailMat = new THREE.MeshStandardMaterial({ color: 0x5a0a10, emissive: 0xff2a20, emissiveIntensity: 0, roughness: 0.3 });
    car.add(grille);
    [-1, 1].forEach(side => {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.17, 0.34), headMat);
      h.position.set(2.02, 0.66, side * 0.56);
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.26, 0.26), tailMat);
      t.position.set(-2.04, 0.74, side * 0.62);
      car.add(h, t);
    });

    // Ruedas: cubierta oscura y llanta blanca de cara al costado.
    const tireMat = mat(0x161616, { roughness: 1 });
    const rimMat = mat(0xffffff, { map: rimTexture(), roughness: 0.35 });
    const tireGeo = new THREE.CylinderGeometry(0.31, 0.31, 0.21, 40);
    tireGeo.rotateX(Math.PI / 2);
    const rimGeo = new THREE.CircleGeometry(0.22, 40);
    const wheels = [];
    [[1.24, 1], [1.24, -1], [-1.23, 1], [-1.23, -1]].forEach(([x, side]) => {
      const w = new THREE.Group();
      w.position.set(x, 0.31, side * 0.72);
      w.add(new THREE.Mesh(tireGeo, tireMat));
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.position.z = side * 0.106;
      if (side < 0) rim.rotation.y = Math.PI;
      w.add(rim);
      car.add(w);
      wheels.push(w);
    });

    car.userData = { headMat, tailMat, wheels };
    return car;
  }

  // Enredadera: una masa de hojas del tamaño de una casa, como la de Moreno.
  function buildIvy() {
    const geo = new THREE.IcosahedronGeometry(1, 5);
    const pos = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      // De esfera a bloque redondeado: se aplana arriba y cae recto a los costados.
      const sq = x => Math.sign(x) * Math.pow(Math.abs(x), 0.55);
      let x = sq(v.x) * 1.7, y = sq(v.y) * 1.9 + 1.9, z = sq(v.z) * 0.9;
      const n = noise3(v.x * 4 + 3, v.y * 4, v.z * 4) - 0.5;
      const fine = noise3(v.x * 14, v.y * 14 + 7, v.z * 14) - 0.5;
      const k = 1 + 0.10 * n + 0.07 * fine;
      pos.setXYZ(i, x * k, Math.max(0, y + 0.12 * n), z * k);
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat(0x8fd26a, { flatShading: true, roughness: 1 }));
  }



  // --- Estado ------------------------------------------------------------------
  const touchDevice = window.matchMedia("(pointer: coarse)").matches;
  const state = { density: "Intermedia", mode: "Color", view: "Atrás", map: false };
  const keys = { up: false, down: false, left: false, right: false, hand: false };

  // --- WebGL -------------------------------------------------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let renderer = null;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1, 1, false);
    renderer.setClearColor(0x000000, 0);
  } catch (e) { renderer = null; }
  if (!renderer) {
    document.querySelector(".stage").innerHTML = '<p class="nogl">Este navegador no tiene WebGL activado, así que el juego no se puede dibujar acá. Probá desde Chrome, Safari o Firefox actualizados.</p>';
    return;
  }

  const scene = new THREE.Scene();
  const fog = new THREE.Fog(0x000000, 16, 58);
  scene.fog = fog;
  const camera = new THREE.PerspectiveCamera(56, 16 / 9, 0.1, 400);
  const hemi = new THREE.HemisphereLight(0x5566b8, 0x0a0810, 0.16);
  const moonLight = new THREE.DirectionalLight(0xb4a8ff, 0.14);
  moonLight.position.set(-30, 60, -60);
  scene.add(hemi, moonLight);
  // La luna sigue a la cámara desde lejos, siempre en el mismo lugar del cielo.
  const MOON_DIR = new THREE.Vector3(-0.35, 0.3, -1).normalize();
  const moon = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff1d6, fog: false }));
  scene.add(moon);

  // El auto, con los faros como linterna.
  const car = buildGolf();
  scene.add(car);
  const { tailMat, wheels } = car.userData;
  car.userData.headMat.emissiveIntensity = 1.3;
  tailMat.emissiveIntensity = 0.5;
  const headBeams = [-0.55, 0.55].map(z => {
    const beam = new THREE.SpotLight(0xfff2dc, 2.1, 44, 0.42, 0.6, 1.3);
    beam.position.set(2.0, 0.7, z);
    beam.target.position.set(22, -1.2, z * 3);
    car.add(beam, beam.target);
    return beam;
  });
  // Una luz propia que acompaña al auto desde arriba, para que el Arlequín se lea de noche.
  const carGlow = new THREE.PointLight(0xe8e4ff, 1.6, 9, 1.2);
  carGlow.position.set(-1.2, 4.2, 0);
  car.add(carGlow);

  // Faroles: pocas luces reales que se mudan a los faroles más cercanos al auto.
  const LAMP_LIGHTS = 8;
  const lampLights = [];
  for (let i = 0; i < LAMP_LIGHTS; i++) {
    const l = new THREE.PointLight(0xffb45c, 0, 24, 1.4);
    scene.add(l);
    lampLights.push(l);
  }

  // --- El mundo: infinito, por zonas -------------------------------------------------
  // Cada celda es una cuadra de 8 m. La base es un laberinto; cada tanto lo cruzan
  // avenidas, se abre una plaza, llega la playa o se termina todo en la nada.
  const T = { STREET: 1, AVENUE: 2, PLAZA: 3, SAND: 4, VOID: 5, FOREST: 6, ROAD: 7, WALL: 10, IVY: 11, SEA: 12, MONUMENT: 13, MOUNTAIN: 14 };
  const SOLID = t => t >= 10 && t !== T.SEA && t !== T.MOUNTAIN;
  const mod = (a, n) => ((a % n) + n) % n;
  let seed = 700, sx = 0, sy = 0;
  const hs = (x, y, k) => hash(x + Math.imul(k + 1, 9973) + seed, y + Math.imul(k + 1, 7919) - seed);
  const fbm = (x, y, z) => 0.65 * noise3(x, y, z) + 0.35 * noise3(x * 2.3 + 11, y * 2.3, z + 3);
  const cache = new Map();

  const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const monteNoise = (x, y) => fbm((x + sy) / 40, (y - sx) / 40, 8.1);
  // Altura del monte en metros, en coordenadas de cuadra: sube lejos de la ciudad y baja antes de la nada.
  // Distancia (en cuadras) al eje de la avenida más cercana y posición a lo largo de ella.
  const roadInfo = (x, y) => {
    const dx = Math.abs(mod(x - 1.5 + 13, 26) - 13), dy = Math.abs(mod(y - 1.5 + 11, 22) - 11);
    return dx < dy ? [dx, y] : [dy, x];
  };
  function heightAt(x, y) {
    const f = monteNoise(x, y);
    const mask = sstep(0.585, 0.62, f) * (1 - sstep(0.645, 0.675, f));
    if (mask <= 0) return 0;
    const m = fbm((x + sx) / 13, (y + sy) / 13, 11.3);
    const hills = Math.max(0, (m - 0.46) * 150);
    const [d, along] = roadInfo(x, y);
    if (d > 12) return hills * mask;
    // En el monte la avenida se vuelve ruta: sube y baja a lo largo, y a los costados
    // se levantan paredes de montaña que después se funden con el resto del monte.
    const wave = 4.9 + 2.6 * Math.sin(along / 5.5 + sx * 0.01) + 1.4 * Math.sin(along / 2.1 + 1.3) + 0.6 * Math.sin(along / 0.9);
    const walls = sstep(1.3, 4.5, d) * (1 - sstep(8, 12, d)) * 16;
    const k = sstep(0.55, 1.9, d);
    return (wave * (1 - k) + Math.max(wave, hills + walls) * k) * mask;
  }

  function zoneAt(x, y) {
    const s = fbm((x + sx) / 60, (y + sy) / 60, 1.7);
    if (s > 0.69) return T.SEA;
    if (s > 0.64) return T.SAND;
    // El monte rodea a la nada: para llegar al abismo hay que cruzarlo.
    const f = monteNoise(x, y);
    if (f > 0.69) return T.VOID;

    const hp = [], hc = [], STEP = 2, N = CHUNK * CELL / STEP;
    const H = [];
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) H.push(heightAt((cx * CHUNK * CELL + i * STEP) / CELL, (cy * CHUNK * CELL + j * STEP) / CELL));

    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = H[j * (N + 1) + i], b = H[j * (N + 1) + i + 1], c = H[(j + 1) * (N + 1) + i], d = H[(j + 1) * (N + 1) + i + 1];

    const midMesh = studPoints(midStuds, whiteStudMat);
    if (midMesh) g.add(midMesh);
    const moteMesh = instanced(MOTE, moteMat, motes, ([x, y, z], m) => m.makeTranslation(x, y, z));
    if (moteMesh) g.add(moteMesh);
    beams.forEach(([x, z, r]) => { const b = new THREE.Mesh(BEAM, beamMat); b.position.set(x, 0, z); b.rotation.set(0.12 * Math.sin(r * 9), 0, 0.12 * Math.cos(r * 9)); g.add(b); });
    const ideaList = ideas.map(([key, x, z, r]) => {

    const polesMesh = instanced(POLE, poleMat, poles, ([x, z, , , y], m) => m.makeTranslation(x, y || 0, z));

    scene.add(g);

  function disposeChunk(c) {

  const dying = [];
  function tickChunks() {

  function updateChunks(all) {

    }

  // --- El auto ---------------------------------------------------------------------
  const player = { x: 0, z: 0, y: 0, vy: 0, air: false, pitch: 0, roll: 0, heading: 0, vx: 0, vz: 0, steer: 0, speed: 0, dist: 0 };
  // Suelo del monte: la misma malla de 2 m que se dibuja, interpolada.
  function groundAt(wx, wz) {

  const MAX_FWD = 24, MAX_REV = 8;
  function physics(dt) {

    let along = player.vx * fx + player.vz * fz;
    const latx = player.vx - fx * along, latz = player.vz - fz * along;

    // Rally: en el aire no hay tracción; en las subidas se frena y en las bajadas se acelera.

    let acc = 0;
    if (keys.up) acc = along < MAX_FWD ? 16 * traction : 0;
    if (keys.down) acc = along > 0.5 ? -30 : (along > -MAX_REV ? -9 : 0);
    if (keys.down && player.air) acc = 0;

    if (keys.hand) along -= Math.sign(along) * Math.min(Math.abs(along), 14 * dt);

  // Altura, inclinación y saltos: el auto sigue el terreno y sale volando en las crestas.
  function terrain(dt) {
    const fx = Math.cos(player.heading), fz = -Math.sin(player.heading), rx = -fz, rz = fx;
    const g = groundAt(player.x, player.z);

  }

  // Dos círculos (trompa y cola) contra las cuadras sólidas vecinas: edificios, enredaderas, el mar.
  function collide() {
    const fx = Math.cos(player.heading), fz = -Math.sin(player.heading);
    let hit = false;
    for (const off of [1.3, -1.3]) {
      const cx = player.x + fx * off, cz = player.z + fz * off, r = 1.0;
      const gx = toCell(cx), gz = toCell(cz);
      for (let y = gz - 1; y <= gz + 1; y++) for (let x = gx - 1; x <= gx + 1; x++) {
        if (!solidAt(x, y)) continue;

  // --- Cámara ------------------------------------------------------------------------
  let shake = 0, camSnap = true;

  const blocksCam = (x, y) => { const t = cellType(x, y); return t === T.WALL || t === T.IVY || t === T.MONUMENT; };
  function placeCamera(dt) {
    const fx = Math.cos(player.heading), fz = -Math.sin(player.heading);
    const want = new THREE.Vector3(), look = new THREE.Vector3();
    if (state.view === "Arriba") {
      camera.up.set(0, 0, -1);
      want.set(player.x + fx * 3, player.y + 22, player.z + fz * 3 + 0.01);
      look.set(player.x + fx * 3, player.y, player.z + fz * 3);
    } else if (state.view === "Adentro") {

      }

    }
    camera.lookAt(camLook);

  // Polvo: puntos que quedan atrás cuando el auto anda rápido por el monte.
  const DUST_N = 60;

  dustGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(DUST_N * 3).fill(-999), 3));
  const dustPts = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xb8a07a, size: 2, sizeAttenuation: false, transparent: true, opacity: 0.9 }));
  scene.add(dustPts);
  const dustLife = new Float32Array(DUST_N), dustVel = new Float32Array(DUST_N * 3);
  let dustNext = 0;
  function dust(dt) {
    const pos = dustGeo.attributes.position.array;

      for (let n = 0; n < 2; n++) {
        const i = dustNext = (dustNext + 1) % DUST_N, fx = Math.cos(player.heading), fz = -Math.sin(player.heading);
        pos[i * 3] = player.x - fx * 2 + (Math.random() - 0.5) * 1.6; pos[i * 3 + 1] = player.y + 0.3; pos[i * 3 + 2] = player.z - fz * 2 + (Math.random() - 0.5) * 1.6;

  // Cada zona tiene su luz: la playa tiene luna, en la nada no hay nada.
  // [cielo, luna, niebla lejos, color de cielo, color de suelo, color de niebla]
  const ZONE_LIGHT = {
    1: [0.38, 0.22, 70, 0xa89cf0, 0x2e2240, 0x1a1236],
    2: [0.52, 0.3, 90, 0xb8b0ff, 0x2e2240, 0x1e1640],
    3: [0.62, 0.3, 80, 0xc8f0c0, 0x2a5a24, 0x14182e],
    4: [0.55, 0.5, 120, 0x9ab0ff, 0x1a1c2a, 0x120e2a],
    5: [0, 0, 200, 0x000000, 0x000000, 0x000000],
    6: [1.45, 1.05, 160, 0xd0e4ff, 0x4a7a44, 0x1a1e38]
  };
  const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();

    const fx = Math.cos(player.heading), fz = -Math.sin(player.heading);

  // --- Zonas y mensajes -------------------------------------------------------------------
  let msg = "", msgUntil = 0, clock = 0, currentZone = 1;
  function message(text, secs) { msg = text; msgUntil = clock + secs; }
  function trackZone() {
    const t = cellType(toCell(player.x), toCell(player.z));
    const zone = t === T.SEA ? T.SAND : t === T.MONUMENT ? T.PLAZA : t === T.MOUNTAIN || t === T.ROAD ? T.FOREST : (t === T.WALL || t === T.IVY) ? T.STREET : t;

  }

  // --- Recorrido ---------------------------------------------------------------------------
  let seen = new Set();
  function markSeen() {

    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx === 0 || dy === 0) seen.add((cx + dx) + "," + (cz + dy));
  }

  // --- Luz: se junta, se gasta, y sin luz aparece el limbo ------------------------------------
  // La capacidad crece con cada orbe y queda guardada en este navegador.
  let cap = 1;
  try { cap = clamp(parseFloat(localStorage.getItem("deriva-luz")) || 1, 1, 4); } catch (e) { /* sin almacenamiento */ }
  let light = Math.max(0.45, cap * 0.6), flash = 0, started = false;
  const collected = new Set();

  // Alrededor del auto orbita tu luz: los puntos encendidos son la que tenés,
  // los apagados, lo que te falta para llenar tu capacidad.
  const ORBIT_MAX = 12;
  const emptyMat = new THREE.MeshBasicMaterial({ color: 0x4a4658 });
  const orbit = new THREE.Group();
  scene.add(orbit);
  for (let i = 0; i < ORBIT_MAX; i++) {
    const m = new THREE.Mesh(ORB_GEO, orbMat);
    m.scale.setScalar(0.22);
    m.userData = { i };
    orbit.add(m);
  }
  function placeOrbit() {
    orbit.position.set(player.x, 0, player.z);
    // Los puntos son tu capacidad (de 4 a 12); los encendidos, la parte que tenés llena.

    orbit.children.forEach((m, i) => {

      m.visible = i < slots;
      m.material = i < lit || (i === lit && light > 0.01 && Math.sin(clock * 9) > 0) ? orbMat : emptyMat;
      m.position.set(Math.cos(a) * 2.9, 1.9 + Math.sin(clock * 1.3 + i) * 0.12, Math.sin(a) * 2.9);
    });
  }

  // Si entrás al mar, el auto se hunde; volvés a la costa con la mitad de tu luz.
  let sinking = null, lastSafe = null;
  // Busca una cuadra adentro de la nada (con nada alrededor) cerca del auto.
  function deepVoidNear() {
    const sx0 = toCell(player.x), sy0 = toCell(player.z);
    for (let r = 1; r < 260; r++) for (let d = -r; d <= r; d += 1) for (const [x, y] of [[sx0 + d, sy0 - r], [sx0 + d, sy0 + r], [sx0 - r, sy0 + d], [sx0 + r, sy0 + d]]) {
      if (cellType(x, y) !== T.VOID) continue;
      let ok = true;
      for (let b = -2; b <= 2 && ok; b++) for (let a = -2; a <= 2; a++) if (cellType(x + a, y + b) !== T.VOID) { ok = false; break; }
      if (ok) return [x, y];
    }
    return null;
  }
  // Caer en la nada: la grilla se rompe y aparecés adentro, a oscuras.
  function fallIntoVoid() {
    const v = deepVoidNear();
    if (!v) return false;
    player.x = toWorld(v[0]); player.z = toWorld(v[1]);
    player.heading = Math.random() * TAU;
    player.vx = player.vz = 0; player.y = 0; player.vy = 0; player.air = false; player.pitch = player.roll = 0;
    currentZone = T.VOID;

    camSnap = true;
    updateChunks(true);
    return true;
  }
  let darkT = 0;

  function tickWater(dt) {
    const t = cellType(toCell(player.x), toCell(player.z));
    if (!sinking) {
      if (t === T.SEA) { sinking = { t: 0 }; keys.up = keys.down = false; return; }
      if (t !== T.VOID && !SOLID(t)) lastSafe = { x: player.x, z: player.z, heading: player.heading };
      return;
    }
    sinking.t += dt;
    light = Math.max(0, light - 0.3 * dt);
    player.vx *= Math.exp(-2.5 * dt); player.vz *= Math.exp(-2.5 * dt);

    const isSeen = (x, y) => seen.has(x + "," + y);
    for (let dy = -halfH; dy <= halfH; dy++) for (let dx = -halfW; dx < halfW; dx++) {
      const x = px + dx, y = pz + dy;
      let near = false;
      for (let b = -1; b <= 1 && !near; b++) for (let a = -1; a <= 1; a++) if (isSeen(x + a, y + b)) { near = true; break; }
      if (!near) continue;
      const t = cellType(x, y);
      if (!SOLID(t) && !isSeen(x, y)) continue;
      const st = MAP_STYLE[t];
      if (!st) continue;
      const r = midR + dy, c = midC + dx * cw;
      for (let k = 0; k < 2; k++) {
        if (r < 1 || r >= rows - 1 || c + k < 0 || c + k >= cols || st[0][k] === " ") continue;
        CH[r * cols + c + k] = st[0][k]; COL[r * cols + c + k] = st[1];
      }
    }
    const a = ((player.heading % TAU) + TAU) % TAU;
    const arrow = a < Math.PI / 4 || a > 7 * Math.PI / 4 ? ">" : a < 3 * Math.PI / 4 ? "^" : a < 5 * Math.PI / 4 ? "<" : "v";
    // Las ideas que todavía no juntaste, cerca de lo recorrido.
    chunks.forEach(ch => ch.ideas.forEach(it => {
      if (it.taken) return;
      const x = toCell(it.x), y = toCell(it.z), dx = x - px, dy = y - pz;
      if (Math.abs(dx) >= halfW || Math.abs(dy) > halfH || !(isSeen(x, y) || isSeen(x + 1, y) || isSeen(x - 1, y) || isSeen(x, y + 1) || isSeen(x, y - 1))) return;
      const i = (midR + dy) * cols + midC + dx * cw;
      if (midR + dy >= 1 && midR + dy < rows - 1) { CH[i] = "*"; COL[i] = "#fff1c4"; }
    }));
    CH[midR * cols + midC] = arrow; COL[midR * cols + midC] = "#f2c200";
  }

  function dashboard() {
    const AMBER = "#ff9a3c", DIM = "#6e3c1c";
    const top = Math.floor(rows * 0.72);
    for (let r = top; r < rows; r++) for (let c = 0; c < cols; c++) { CH[r * cols + c] = null; }
    for (let c = 0; c < cols; c++) { CH[top * cols + c] = "_"; COL[top * cols + c] = DIM; }
    const R = Math.max(3, Math.floor((rows - top) * 0.42));
    const gauge = (cx, cy, v) => {
      // Arco de 225° a -45°, con marcas; la aguja apunta según el valor (0 a 1).
      for (let a = 0; a <= 1.0001; a += 1 / (R * 5)) {
        const ang = (225 - 270 * a) * Math.PI / 180;
        const c = Math.round(cx + Math.cos(ang) * R / 0.6), r = Math.round(cy - Math.sin(ang) * R);
        if (r > top && r < rows && c >= 0 && c < cols) { CH[r * cols + c] = a <= v ? "·" : "."; COL[r * cols + c] = a <= v ? AMBER : DIM; }
      }
      const ang = (225 - 270 * clamp(v, 0, 1)) * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
      const ch = Math.abs(ca) > 0.92 ? "-" : Math.abs(sa) > 0.92 ? "|" : ca * sa > 0 ? "/" : "\\";
      for (let k = 0; k < R - 0.5; k += 0.5) {
        const c = Math.round(cx + ca * k / 0.6), r = Math.round(cy - sa * k);
        if (r > top && r < rows && c >= 0 && c < cols) { CH[r * cols + c] = ch; COL[r * cols + c] = AMBER; }
      }
      CH[cy * cols + cx] = "o"; COL[cy * cols + cx] = AMBER;
    };
    const cy = Math.min(rows - 1, top + R + 1);
    gauge(Math.round(cols * 0.3), cy, player.speed / MAX_FWD);
    gauge(Math.round(cols * 0.7), cy, light / cap);
  }

  function hud() {
    if (ending) return;
    if (state.view === "Adentro" && !state.map) dashboard();
    const write = (text, r, align) => {
      const c0 = align === "right" ? cols - text.length - 1 : align === "center" ? Math.floor((cols - text.length) / 2) : 1;
      for (let k = 0; k < text.length; k++) {
        const c = c0 + k;
        if (c < 0 || c >= cols) continue;
        CH[r * cols + c] = text[k] === " " ? null : text[k];
        COL[r * cols + c] = HUD;
      }
    };
    // Antes de moverse, una sola flecha que titila arriba del auto.
    if (!started && Math.sin(clock * 5) > -0.2 && !state.map) {
      const i = Math.floor(rows * 0.3) * cols + Math.floor(cols / 2);
      CH[i] = "↑"; COL[i] = HUD;
    }
    if (whisper && clock < whisper.until) {
      for (let k = 0; k < whisper.text.length; k++) {
        const i = whisper.r * cols + whisper.c + k;
        if (whisper.text[k] !== " ") { CH[i] = whisper.text[k]; COL[i] = "#9a8fa8"; }
      }
    }
    if (msg && clock < msgUntil) {
      const pad = " " + msg + " ";
      const r = Math.floor(rows / 2);
      // El mensaje limpia su fila para leerse sobre la escena.
      for (let c = Math.floor((cols - pad.length) / 2); c < Math.floor((cols + pad.length) / 2); c++) if (c >= 0 && c < cols) CH[r * cols + c] = null;
      const shown = voidK < 0.3 ? pad : pad.replace(/[^ ]/g, ch => Math.random() < 0.25 * voidK ? RAMP[1 + Math.floor(Math.random() * (RAMP.length - 1))] : ch);
      write(shown, r, "center");
    }
  }

  function paint() {
    const cw = canvas.width / cols, chh = canvas.height / rows;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = chh.toFixed(2) + 'px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let last = "";
    for (let ri = 0; ri < rows; ri++) for (let ci = 0; ci < cols; ci++) {
      const i = ri * cols + ci, ch = CH[i];
      if (!ch) continue;
      if (COL[i] !== last) { ctx.fillStyle = COL[i]; last = COL[i]; }
      ctx.fillText(ch, (ci + 0.5) * cw, (ri + 0.5) * chh);
    }
  }


  // --- Controles ---------------------------------------------------------------------------------
  const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "hand" };
  let engaged = false;
  window.addEventListener("keydown", e => {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; started = true; if (engaged) e.preventDefault(); return; }
    if (e.code === "KeyC") setOpt("view", VIEWS[(VIEWS.indexOf(state.view) + 1) % VIEWS.length]);
    if (e.code === "KeyM") setOpt("map", !state.map);
    if (e.code === "KeyR") newWorld((Math.random() * 1e9) | 0);
  });
  window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  window.addEventListener("blur", () => Object.keys(keys).forEach(k => { keys[k] = false; }));
  canvas.addEventListener("pointerdown", () => { engaged = true; canvas.focus(); });

  // Giroscopio: el celu horizontal es el volante. Se mide hacia dónde cae la gravedad sobre
  // la pantalla, así no importa cuánto lo inclines hacia atrás.
  const gyro = { on: false, steer: 0, heard: 0 };
  const gyroBtn = document.getElementById("pad-gyro");
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    gyro.heard = performance.now();
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b); // "arriba" del mundo visto en el celu
    const th = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
    const sx = ux * Math.cos(th) - uy * Math.sin(th), sy = ux * Math.sin(th) + uy * Math.cos(th);
    let a = Math.atan2(sx, sy) * 180 / Math.PI; // inclinación como volante, en grados
    a = Math.abs(a) < 3 ? 0 : a - Math.sign(a) * 3;
    gyro.steer = clamp(a / 22, -1, 1);
  }
  function setGyro(on) {
    gyro.on = on;
    document.body.classList.toggle("gyro", on);
    gyroBtn.setAttribute("aria-pressed", String(on));
    gyroBtn.textContent = on ? "Giroscopio" : gyroBtn.dataset.failed ? "Sin giroscopio" : "Giroscopio";
  }
  gyroBtn.addEventListener("click", async () => {
    if (gyro.on) { setGyro(false); return; }
    started = true;
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== "granted") throw new Error("denegado");
      }
      window.addEventListener("deviceorientation", onOrient);
      setGyro(true);
      // Si en un segundo y medio no llega nada, este navegador (o el marco) no lo deja.
      setTimeout(() => { if (performance.now() - gyro.heard > 1400) { gyroBtn.dataset.failed = "1"; setGyro(false); } }, 1500);
    } catch (err) { gyroBtn.dataset.failed = "1"; setGyro(false); }
  });

  // Con el giroscopio, la pantalla es el pedal: derecha acelera, izquierda frena.
  const pedal = e => {
    if (!gyro.on) return;
    const r = canvas.getBoundingClientRect();
    const right = e.clientX - r.left > r.width * 0.4;
    keys.up = right; keys.down = !right; started = true;
  };
  canvas.addEventListener("pointerdown", e => { pedal(e); try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ } });
  canvas.addEventListener("pointermove", e => { if (gyro.on && (keys.up || keys.down)) pedal(e); });
  const release = () => { if (gyro.on) { keys.up = keys.down = false; } };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  // Pantalla completa y horizontal, donde se pueda.
  const fullBtn = document.getElementById("pad-full");
  fullBtn.addEventListener("click", async () => {
    const on = !document.body.classList.contains("full");
    document.body.classList.toggle("full", on);
    fullBtn.textContent = on ? "Salir" : "Pantalla completa";
    fullBtn.setAttribute("aria-pressed", String(on));
    // Si el navegador tiene pantalla completa de verdad, la usa además; si no, alcanza con tapar la página.
    try {
      if (!on && document.fullscreenElement) await document.exitFullscreen();
      else if (on && document.documentElement.requestFullscreen) { await document.documentElement.requestFullscreen(); try { await screen.orientation.lock("landscape"); } catch (e) { /* no se puede bloquear */ } }
    } catch (e) { /* sin pantalla completa del navegador */ }
    setTimeout(layout, 200);
  });
  document.addEventListener("fullscreenchange", () => setTimeout(layout, 200));
  canvas.addEventListener("focus", () => { engaged = true; });
  canvas.addEventListener("blur", () => { engaged = false; });

  document.querySelectorAll("#pad button").forEach(btn => {
    const k = btn.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = true; started = true; btn.dataset.down = "true"; try { btn.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ } };
    const off = () => { keys[k] = false; btn.dataset.down = "false"; };
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("lostpointercapture", off);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  const opts = document.getElementById("opts");
  const segs = {};
  function addSeg(label, key, values) {
    const wrap = document.createElement("div");
    wrap.className = "ctl";
    wrap.innerHTML = '<span class="ctl-label" id="lbl-' + key + '">' + label + "</span>";
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-labelledby", "lbl-" + key);
    values.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.id = key + "-" + v;
      b.textContent = v;
      b.addEventListener("click", () => setOpt(key, v));
      seg.appendChild(b);
    });
    wrap.appendChild(seg);
    opts.appendChild(wrap);
    segs[key] = seg;
  }
  const VIEWS = ["Atrás", "Adentro", "Arriba"];
  addSeg("Cámara", "view", VIEWS);
  addSeg("Densidad", "density", Object.keys(DENSITY));
  addSeg("Modo", "mode", Object.keys(MODES));
  const mapBtn = document.createElement("button");
  mapBtn.type = "button"; mapBtn.id = "btn-map";
  mapBtn.addEventListener("click", () => setOpt("map", !state.map));
  const newBtn = document.createElement("button");
  newBtn.type = "button"; newBtn.id = "btn-new"; newBtn.textContent = "Otra ciudad";
  newBtn.addEventListener("click", () => newWorld((Math.random() * 1e9) | 0));
  opts.append(mapBtn, newBtn);

  function setOpt(key, value) {
    state[key] = value;
    Object.keys(segs).forEach(k => segs[k].querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.textContent === state[k]))));
    mapBtn.textContent = state.map ? "Volver a manejar" : "Ver mapa";
    mapBtn.setAttribute("aria-pressed", String(state.map));
    if (key === "density") layout();
    if (key === "view") camSnap = true;
  }

  // --- Bucle ----------------------------------------------------------------------------------------
  let lastTs = 0, lastPaint = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (document.hidden) { lastTs = ts; return; }
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    clock += dt;
    water.uniforms.uTime.value = clock;
    if (!state.map) { if (sinking || ending) { player.x += player.vx * dt; player.z += player.vz * dt; } else physics(dt); tickWater(dt); }
    tickHorizon();
    tickEnding(dt);
    tickLight(dt);
    markSeen();
    trackZone();
    updateChunks(false);
    tickChunks();
    if (ts - lastPaint < 33) return;
    const pdt = lastPaint ? Math.min(0.1, (ts - lastPaint) / 1000) : 0.033;
    lastPaint = ts;
    placeWorld(pdt);
    placeOrbit();
    tickVoid(pdt);
    placeCamera(pdt);
    if (state.map) automap(); else { shade(); if (voidK > 0.02) glitch(); endingOverlay(); }
    hud();
    paint();
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });

  setOpt("view", state.view);
  layout();
  newWorld(700);
  const start = () => { layout(); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load) document.fonts.load('16px "IBM Plex Mono"', "abc").then(start, start);
  else start();
})();
</script>

</html>
